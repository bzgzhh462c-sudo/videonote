  <script>
    // ========== DOM ==========
    const mediaFileInput = document.getElementById('mediaFileInput');
    const mainVideo = document.getElementById('mainVideo');
    const audioCoverBox = document.getElementById('audioCoverBox');
    const mediaFileName = document.getElementById('mediaFileName');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const mediaProgressBar = document.getElementById('mediaProgressBar');
    const waveformScrollContainer = document.getElementById('waveformScrollContainer');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const ctx = waveformCanvas.getContext('2d');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
    const toggleAutoScrollBtn = document.getElementById('toggleAutoScrollBtn');
    const autoScrollStatusText = document.getElementById('autoScrollStatusText');
    const toggleLoopBtn = document.getElementById('toggleLoopBtn');
    const loopStatusText = document.getElementById('loopStatusText');
    const clearABBtn = document.getElementById('clearABBtn');
    const inputTimeA = document.getElementById('inputTimeA');
    const inputTimeB = document.getElementById('inputTimeB');
    const aMinusBtn = document.getElementById('aMinusBtn');
    const aPlusBtn = document.getElementById('aPlusBtn');
    const bMinusBtn = document.getElementById('bMinusBtn');
    const bPlusBtn = document.getElementById('bPlusBtn');
    const noteTextarea = document.getElementById('noteTextarea');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const saveAsNoteBtn = document.getElementById('saveAsNoteBtn');
    const openNativeFileBtn = document.getElementById('openNativeFileBtn');
    const fallbackNoteFileInput = document.getElementById('fallbackNoteFileInput');
    const insertTimestampBtn = document.getElementById('insertTimestampBtn');
    const saveStateText = document.getElementById('saveStateText');
    const wordCountText = document.getElementById('wordCountText');
    const waveformResizer = document.getElementById('waveformResizer');
    const waveformBox = document.getElementById('waveformBox');
    const panelResizer = document.getElementById('panelResizer');
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');
    // ========== State ==========
    let audioCtx = null;
    let audioBuffer = null;
    let sourceNode = null;
    let isPlaying = false;
    let startTime = 0;
    let pauseOffset = 0;
    let mediaDuration = 0;
    let zoomLevel = 1.0;
    let isAutoScrollEnabled = true;
    let pointA = null;
    let pointB = null;
    let isLooping = false;
    let rawChannelData = null;
    let isVideoMode = false;
    let mediaObjectURL = null;
    let isSeekingVideo = false;
    let isMouseDown = false;
    let dragMode = null;
    let dragStartX = 0;
    let dragStartA = 0;
    let dragOffsetTimeA = 0;
    let dragRangeDuration = 0;
    let dragPlayheadOffset = 0;
    let previewTime = null;
    let currentFileHandle = null;   // 核心：绑定的可写文件句柄
    let loadedFileName = '';
    let waveformCache = null;
    let cacheWidth = 0;
    let cacheHeight = 0;
    let cacheZoom = 0;
    let renderPending = false;
    let progressRAF = null;
    let noteSaveTimer = null; // 笔记防抖定时器
    // ========== 1. Load Media ==========
    async function loadMediaFile(file) {
      try {
        stopPlayback();
        if (mediaObjectURL) {
          URL.revokeObjectURL(mediaObjectURL);
          mediaObjectURL = null;
        }
        mainVideo.removeAttribute('src');
        mainVideo.load();
        isVideoMode = false;
        mainVideo.muted = false;
        mainVideo.volume = 1;
        mainVideo.pause();
        audioBuffer = null;
        rawChannelData = null;
        mediaDuration = 0;
        previewTime = null;
        isSeekingVideo = false;
        const isVideo = file.type.startsWith('video/') ||
          /\.(mp4|webm|mov|mkv|m4v|avi)$/i.test(file.name);
        const arrayBuffer = await file.arrayBuffer();
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
          mediaDuration = audioBuffer.duration;
          rawChannelData = audioBuffer.getChannelData(0);
        } catch (decodeErr) {
          console.warn('音频解码失败:', decodeErr);
          if (!isVideo) throw decodeErr;
        }
        mediaFileName.textContent = file.name;
        if (isVideo) {
          isVideoMode = true;
          mediaObjectURL = URL.createObjectURL(file);
          mainVideo.src = mediaObjectURL;
          mainVideo.classList.remove('hidden');
          audioCoverBox.classList.add('hidden');
          await new Promise((resolve) => {
            const onMeta = () => {
              mainVideo.removeEventListener('loadedmetadata', onMeta);
              if (!mediaDuration || mediaDuration < 0.1) {
                mediaDuration = mainVideo.duration || 0;
              }
              resolve();
            };
            if (mainVideo.readyState >= 1) onMeta();
            else mainVideo.addEventListener('loadedmetadata', onMeta);
          });
        } else {
          isVideoMode = false;
          mainVideo.classList.add('hidden');
          audioCoverBox.classList.remove('hidden');
          audioCoverBox.classList.add('flex');
        }
        invalidateWaveformCache();
        requestDrawWaveform();
        updateProgress();
      } catch (err) {
        console.error('媒体加载失败:', err);
        alert('无法解析该文件，请尝试其他 mp3 / wav / mp4 / webm 格式。');
      }
    }
    mediaFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadMediaFile(file);
    });
    // ========== 2. Playback ==========
    function getCurrentTime() {
      if (previewTime !== null) return previewTime;
      if (isVideoMode) {
        let cur = mainVideo.currentTime || 0;
        if (isLooping && pointA !== null && pointB !== null && pointA < pointB && !isMouseDown) {
          if (cur >= pointB) {
            const len = pointB - pointA;
            cur = pointA + ((cur - pointA) % len);
          }
        }
        return Math.min(mediaDuration || mainVideo.duration || 0, Math.max(0, cur));
      }
      if (!isPlaying) return pauseOffset;
      let cur = audioCtx.currentTime - startTime;
      if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
        if (cur >= pointB) {
          const len = pointB - pointA;
          cur = pointA + ((cur - pointA) % len);
        }
      }
      return Math.min(mediaDuration, Math.max(0, cur));
    }
    function playMedia(offset = 0) {
  previewTime = null;

  // ========== 视频模式 ==========
  if (isVideoMode) {
    if (!mainVideo.src) return;
    if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
      if (offset < pointA || offset >= pointB) offset = pointA;
    }
    safeVideoSeek(offset, () => {
      mainVideo.play().catch(e => console.warn('video play', e));
    });
    isPlaying = true;
    playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
    startProgressLoop();
    return;
  }

  // ========== 纯音频模式（强化版） ==========
  if (!audioBuffer) {
    console.warn('audioBuffer 为空，无法播放');
    return;
  }

  // 确保 AudioContext 存在
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  const doStart = () => {
    try {
      stopAudioSource();

      sourceNode = audioCtx.createBufferSource();
      sourceNode.buffer = audioBuffer;

      if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
        if (offset < pointA || offset >= pointB) offset = pointA;
        sourceNode.loop = true;
        sourceNode.loopStart = pointA;
        sourceNode.loopEnd = pointB;
      } else {
        sourceNode.loop = false;
      }

      sourceNode.connect(audioCtx.destination);
      sourceNode.start(0, Math.max(0, offset));

      startTime = audioCtx.currentTime - offset;
      isPlaying = true;
      playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

      sourceNode.onended = () => {
        if (!isLooping && isPlaying) {
          stopPlayback();
          pauseOffset = 0;
        }
      };

      startProgressLoop();
      console.log('纯音频开始播放', { offset, state: audioCtx.state });
    } catch (err) {
      console.error('纯音频启动失败:', err);
    }
  };

  // 关键：强制 resume，并等待真正 running
  if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
    audioCtx.resume().then(() => {
      // 再确认一次状态
      if (audioCtx.state === 'running') {
        doStart();
      } else {
        // 极端情况再试一次
        setTimeout(() => {
          audioCtx.resume().then(doStart).catch(doStart);
        }, 50);
      }
    }).catch(err => {
      console.warn('AudioContext resume 失败，尝试直接播放', err);
      doStart();
    });
  } else {
    doStart();
  }
}
    function stopAudioSource() {
      if (sourceNode) {
        try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
        sourceNode = null;
      }
    }
    function stopPlayback() {
      if (isVideoMode) {
        mainVideo.pause();
      } else {
        stopAudioSource();
      }
      isPlaying = false;
      playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      stopProgressLoop();
    }
function safeVideoSeek(time, onDone) {
  if (!isVideoMode) return;
  if (isSeekingVideo) return;
  isSeekingVideo = true;

  const wasPlaying = !mainVideo.paused && isPlaying;
  const originalVolume = mainVideo.volume || 1;
  const target = Math.max(0, Math.min(mediaDuration || mainVideo.duration || 0, time));

  // 已经非常接近就跳过
  if (Math.abs(mainVideo.currentTime - target) < 0.025) {
    isSeekingVideo = false;
    if (typeof onDone === 'function') onDone();
    else if (wasPlaying) mainVideo.play().catch(() => {});
    return;
  }

  // 1. 强制静音 + 音量归零 + 暂停
  mainVideo.muted = true;
  mainVideo.volume = 0;
  mainVideo.pause();
  mainVideo.currentTime = target;

  let finished = false;

  const finish = () => {
    if (finished) return;
    finished = true;

    // 2. 先保持静音状态，给解码器更长稳定时间
    setTimeout(() => {
      isSeekingVideo = false;
      updateProgress();
      requestDrawWaveform();

      const startPlay = () => {
        // 播放前确保还是静音的
        mainVideo.muted = true;
        mainVideo.volume = 0;

        mainVideo.play().then(() => {
          // 3. 播放开始后再做短时间音量淡入（关键！消除延迟噪声）
          let vol = 0;
          const fadeSteps = 8;          // 分 8 步淡入
          const fadeInterval = 25;      // 每步 25ms，总共约 200ms
          const step = originalVolume / fadeSteps;

          const fadeTimer = setInterval(() => {
            vol += step;
            if (vol >= originalVolume) {
              vol = originalVolume;
              clearInterval(fadeTimer);
              mainVideo.muted = false;  // 淡入完成后再取消 muted
            }
            mainVideo.volume = vol;
          }, fadeInterval);
        }).catch(e => {
          console.warn('play after seek failed', e);
          // 失败就直接恢复
          mainVideo.volume = originalVolume;
          mainVideo.muted = false;
        });
      };

      if (typeof onDone === 'function') {
        // playMedia 调用时会走这里
        onDone();
      } else if (wasPlaying) {
        startPlay();
      } else {
        // 只是定位，不播放，也要恢复音量状态
        mainVideo.volume = originalVolume;
        mainVideo.muted = false;
      }
    }, 100); // 稳定等待时间，可调 80~150
  };

  const onSeeked = () => {
    mainVideo.removeEventListener('seeked', onSeeked);
    requestAnimationFrame(() => {
      requestAnimationFrame(finish);
    });
  };
  mainVideo.addEventListener('seeked', onSeeked);

  // 超时兜底
  setTimeout(finish, 320);
}
    function seekMedia(targetTime) {
      const t = Math.max(0, Math.min(mediaDuration || 99999, targetTime));
      pauseOffset = t;
      previewTime = null;
      if (isVideoMode) {
        safeVideoSeek(t);
      } else {
        if (isPlaying) {
          playMedia(t);
        } else {
          updateProgress();
          requestDrawWaveform();
        }
      }
    }
    function togglePlay() {
      if (isVideoMode) {
        if (!mainVideo.src) return;
        if (isPlaying || !mainVideo.paused) {
          pauseOffset = mainVideo.currentTime;
          stopPlayback();
        } else {
          playMedia(pauseOffset || mainVideo.currentTime);
        }
        return;
      }
      if (!audioBuffer) return;
      if (isPlaying) {
        pauseOffset = getCurrentTime();
        stopPlayback();
      } else {
        playMedia(pauseOffset);
      }
    }
    playPauseBtn.addEventListener('click', togglePlay);
    audioCoverBox.addEventListener('click', togglePlay);
    mainVideo.addEventListener('click', togglePlay);
    mainVideo.addEventListener('timeupdate', () => {
      if (!isVideoMode || !isPlaying || isMouseDown || isSeekingVideo) return;
      if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
        if (mainVideo.currentTime >= pointB - 0.04) {
          safeVideoSeek(pointA);
        }
      }
    });
    mainVideo.addEventListener('ended', () => {
      if (!isLooping) {
        stopPlayback();
        pauseOffset = 0;
      }
    });
    mainVideo.addEventListener('play', () => {
      isPlaying = true;
      playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      startProgressLoop();
    });
    mainVideo.addEventListener('pause', () => {
      if (isVideoMode) {
        isPlaying = false;
        playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        pauseOffset = mainVideo.currentTime;
        stopProgressLoop();
      }
    });
    function startProgressLoop() {
      stopProgressLoop();
      function loop() {
        if (!isPlaying) return;
        updateProgress();
        requestDrawWaveform();
        progressRAF = requestAnimationFrame(loop);
      }
      progressRAF = requestAnimationFrame(loop);
    }
    function stopProgressLoop() {
      if (progressRAF) {
        cancelAnimationFrame(progressRAF);
        progressRAF = null;
      }
    }
    function updateProgress() {
      const cur = getCurrentTime();
      const dur = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      mediaProgressBar.value = dur ? (cur / dur) * 100 : 0;
    }
    mediaProgressBar.addEventListener('input', (e) => {
      const dur = mediaDuration || (isVideoMode ? mainVideo.duration : 0);
      if (dur) seekMedia((e.target.value / 100) * dur);
    });
    // ========== 3. Waveform ==========
    function invalidateWaveformCache() {
      waveformCache = null;
      cacheWidth = 0;
      cacheHeight = 0;
      cacheZoom = 0;
    }
    function buildWaveformCache(canvasWidth, canvasHeight) {
      const dpr = window.devicePixelRatio || 1;
      const off = document.createElement('canvas');
      off.width = canvasWidth * dpr;
      off.height = canvasHeight * dpr;
      const octx = off.getContext('2d');
      octx.scale(dpr, dpr);
      octx.fillStyle = '#020617';
      octx.fillRect(0, 0, canvasWidth, canvasHeight);
      if (!rawChannelData) {
        octx.fillStyle = '#475569';
        octx.font = '13px sans-serif';
        octx.textAlign = 'center';
        octx.fillText(isVideoMode ? '视频已加载（无可用音轨或解码中）' : '请打开音频/视频文件，此处显示高精度波形', canvasWidth / 2, canvasHeight / 2);
        waveformCache = off;
        cacheWidth = canvasWidth;
        cacheHeight = canvasHeight;
        cacheZoom = zoomLevel;
        return;
      }
      const midY = canvasHeight / 2;
      const maxBarHeight = midY * 0.88;
      const totalSamples = rawChannelData.length;
      const step = Math.max(1, Math.ceil(totalSamples / canvasWidth));
      octx.fillStyle = '#38bdf8';
      for (let i = 0; i < canvasWidth; i++) {
        let min = 1.0, max = -1.0;
        const start = i * step;
        const end = Math.min(start + step, totalSamples);
        for (let j = start; j < end; j++) {
          const val = rawChannelData[j];
          if (val < min) min = val;
          if (val > max) max = val;
        }
        const amp = Math.max(Math.abs(min), Math.abs(max));
        const h = amp * maxBarHeight;
        octx.fillRect(i, midY - h, 1, Math.max(1, h * 2));
      }
      octx.strokeStyle = '#1e293b';
      octx.beginPath();
      octx.moveTo(0, midY);
      octx.lineTo(canvasWidth, midY);
      octx.stroke();
      waveformCache = off;
      cacheWidth = canvasWidth;
      cacheHeight = canvasHeight;
      cacheZoom = zoomLevel;
    }
    function requestDrawWaveform() {
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(() => {
        drawWaveform();
        renderPending = false;
      });
    }
    function drawWaveform() {
      const containerWidth = waveformScrollContainer.clientWidth;
      const canvasWidth = Math.max(containerWidth, Math.floor(containerWidth * zoomLevel));
      const canvasHeight = waveformScrollContainer.clientHeight || 120;
      const dpr = window.devicePixelRatio || 1;
      if (waveformCanvas.width !== canvasWidth * dpr || waveformCanvas.height !== canvasHeight * dpr) {
        waveformCanvas.width = canvasWidth * dpr;
        waveformCanvas.height = canvasHeight * dpr;
        waveformCanvas.style.width = canvasWidth + 'px';
        waveformCanvas.style.height = canvasHeight + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!waveformCache || cacheWidth !== canvasWidth || cacheHeight !== canvasHeight || cacheZoom !== zoomLevel) {
        buildWaveformCache(canvasWidth, canvasHeight);
      }
      ctx.drawImage(waveformCache, 0, 0, canvasWidth, canvasHeight);
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (duration > 0) {
        if (pointA !== null && pointB !== null) {
          const xA = (pointA / duration) * canvasWidth;
          const xB = (pointB / duration) * canvasWidth;
          const startX = Math.min(xA, xB);
          const endX = Math.max(xA, xB);
          ctx.fillStyle = 'rgba(14, 165, 233, 0.25)';
          ctx.fillRect(startX, 0, endX - startX, canvasHeight);
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(startX, 0, endX - startX, 2);
          ctx.fillRect(startX, canvasHeight - 2, endX - startX, 2);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(xA, 0);
          ctx.lineTo(xA, canvasHeight);
          ctx.stroke();
          ctx.fillStyle = '#10b981';
          ctx.fillRect(xA - 7, 0, 14, 18);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('A', xA, 13);
          ctx.strokeStyle = '#f43f5e';
          ctx.beginPath();
          ctx.moveTo(xB, 0);
          ctx.lineTo(xB, canvasHeight);
          ctx.stroke();
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(xB - 7, 0, 14, 18);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('B', xB, 13);
        }
        const playX = (getCurrentTime() / duration) * canvasWidth;
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(playX, 0);
        ctx.lineTo(playX, canvasHeight);
        ctx.stroke();
        if (isAutoScrollEnabled && zoomLevel > 1.0 && isPlaying && previewTime === null) {
          const viewW = waveformScrollContainer.clientWidth;
          const target = playX - viewW / 2;
          const current = waveformScrollContainer.scrollLeft;
          if (Math.abs(current - target) > 2) {
            waveformScrollContainer.scrollLeft = target;
          }
        }
      }
    }
    // ========== 4. Zoom & Drag ==========
    zoomInBtn.addEventListener('click', () => {
      zoomLevel = Math.min(20.0, zoomLevel + 1.0);
      zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
      invalidateWaveformCache();
      requestDrawWaveform();
    });
    zoomOutBtn.addEventListener('click', () => {
      zoomLevel = Math.max(1.0, zoomLevel - 1.0);
      zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
      invalidateWaveformCache();
      requestDrawWaveform();
    });
    toggleAutoScrollBtn.addEventListener('click', () => {
      isAutoScrollEnabled = !isAutoScrollEnabled;
      autoScrollStatusText.textContent = isAutoScrollEnabled ? '开' : '关';
      autoScrollStatusText.className = isAutoScrollEnabled ? 'text-emerald-400' : 'text-rose-400';
    });
    function getCanvasTimeFromEvent(e) {
      const rect = waveformCanvas.getBoundingClientRect();
      const cssWidth = waveformCanvas.clientWidth;
      const clickX = e.clientX - rect.left;
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration || cssWidth === 0) return 0;
      return Math.max(0, Math.min(duration, (clickX / cssWidth) * duration));
    }
    waveformCanvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      dragStartX = e.clientX;
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration) return;
      const clickTime = getCanvasTimeFromEvent(e);
      const cssWidth = waveformCanvas.clientWidth;
      const clickX = e.clientX - waveformCanvas.getBoundingClientRect().left;
      const curPlay = getCurrentTime();
      if (pointA !== null && pointB !== null) {
        const xA = (pointA / duration) * cssWidth;
        const xB = (pointB / duration) * cssWidth;
        if (Math.abs(clickX - xA) <= 12) {
          dragMode = 'A';
          previewTime = pointA;
          return;
        }
        if (Math.abs(clickX - xB) <= 12) {
          dragMode = 'B';
          previewTime = pointB;
          return;
        }
        if (clickX > Math.min(xA, xB) && clickX < Math.max(xA, xB)) {
          dragMode = 'RANGE';
          dragOffsetTimeA = clickTime - pointA;
          dragRangeDuration = pointB - pointA;
          dragPlayheadOffset = Math.max(0, Math.min(dragRangeDuration, curPlay - pointA));
          previewTime = pointA + dragPlayheadOffset;
          waveformCanvas.style.cursor = 'grabbing';
          return;
        }
      }
      dragMode = 'SELECT';
      dragStartA = clickTime;
      previewTime = clickTime;
    });
    window.addEventListener('mousemove', (e) => {
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration) return;
      const currentTime = getCanvasTimeFromEvent(e);
      const cssWidth = waveformCanvas.clientWidth;
      const currentX = e.clientX - waveformCanvas.getBoundingClientRect().left;
      if (!isMouseDown && pointA !== null && pointB !== null) {
        const xA = (pointA / duration) * cssWidth;
        const xB = (pointB / duration) * cssWidth;
        if (Math.abs(currentX - xA) <= 12 || Math.abs(currentX - xB) <= 12) {
          waveformCanvas.style.cursor = 'col-resize';
        } else if (currentX > Math.min(xA, xB) && currentX < Math.max(xA, xB)) {
          waveformCanvas.style.cursor = 'grab';
        } else {
          waveformCanvas.style.cursor = 'crosshair';
        }
      }
      if (!isMouseDown || !dragMode) return;
      if (dragMode === 'A') {
        pointA = Math.min(currentTime, pointB - 0.1);
        previewTime = pointA;
      } else if (dragMode === 'B') {
        pointB = Math.max(currentTime, pointA + 0.1);
        previewTime = pointB;
      } else if (dragMode === 'RANGE') {
        let newA = currentTime - dragOffsetTimeA;
        if (newA < 0) newA = 0;
        if (newA + dragRangeDuration > duration) newA = duration - dragRangeDuration;
        pointA = newA;
        pointB = newA + dragRangeDuration;
        previewTime = pointA + dragPlayheadOffset;
      } else if (dragMode === 'SELECT') {
        pointA = Math.min(dragStartA, currentTime);
        pointB = Math.max(dragStartA, currentTime);
        previewTime = pointA;
      }
      enforceABConstraint();
      updateABInputs();
      requestDrawWaveform();
    });
    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      const moveDist = Math.abs(e.clientX - dragStartX);
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (dragMode === 'SELECT' && moveDist < 5) {
        if (duration > 0) {
          const clickTime = getCanvasTimeFromEvent(e);
          pointA = clickTime;
          pointB = Math.min(duration, clickTime + 3.0);
          previewTime = clickTime;
        }
      }
      if (previewTime !== null) {
        seekMedia(previewTime);
      }
      previewTime = null;
      if (dragMode === 'RANGE') waveformCanvas.style.cursor = 'grab';
      isMouseDown = false;
      dragMode = null;
      enforceABConstraint();
      updateABInputs();
      if (isLooping && isPlaying && !isVideoMode) {
        playMedia(getCurrentTime());
      }
      requestDrawWaveform();
    });
    function enforceABConstraint() {
      if (pointA !== null && pointB !== null) {
        if (pointB < pointA) {
          const t = pointA; pointA = pointB; pointB = t;
        }
        if (pointB - pointA < 0.1) pointB = pointA + 0.1;
      }
    }
    toggleLoopBtn.addEventListener('click', () => {
      isLooping = !isLooping;
      loopStatusText.textContent = isLooping ? '开' : '关';
      loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
    });
    clearABBtn.addEventListener('click', () => {
      pointA = null;
      pointB = null;
      isLooping = false;
      loopStatusText.textContent = '关';
      loopStatusText.className = 'text-rose-400';
      previewTime = null;
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });
    function updateABInputs() {
      inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
      inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
    }
    inputTimeA.addEventListener('change', () => {
      pointA = parseFloat(inputTimeA.value) || 0;
      enforceABConstraint();
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });
    inputTimeB.addEventListener('change', () => {
      pointB = parseFloat(inputTimeB.value) || 0;
      enforceABConstraint();
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });
    aMinusBtn.addEventListener('click', () => {
      if (pointA !== null) {
        pointA = Math.max(0, pointA - 0.1);
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    aPlusBtn.addEventListener('click', () => {
      if (pointA !== null) {
        pointA += 0.1;
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    bMinusBtn.addEventListener('click', () => {
      if (pointB !== null) {
        pointB = Math.max(pointA + 0.1, pointB - 0.1);
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    bPlusBtn.addEventListener('click', () => {
      if (pointB !== null) {
        pointB += 0.1;
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    // ========== 5. 笔记保存 ==========
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== noteTextarea && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveNoteDirectly();
      }
    });
    openNativeFileBtn.addEventListener('click', async () => {
      if ('showOpenFilePicker' in window) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'Markdown / Text', accept: { 'text/plain': ['.md', '.txt'] } }]
          });
          currentFileHandle = handle;
          const file = await handle.getFile();
          loadedFileName = file.name;
          const text = await file.text();
          noteTextarea.value = text;
          wordCountText.textContent = `${text.length} 字`;
          const timeNow = new Date().toLocaleTimeString();
          saveStateText.textContent = `已成功绑定原文件: ${handle.name} (时间: ${timeNow})`;
          saveStateText.className = 'text-emerald-400 font-semibold';
          saveBtnText.textContent = '覆写保存 (⌘S)';
        } catch (err) {
          console.log('用户取消选择或授权未通过');
        }
      } else {
        fallbackNoteFileInput.click();
      }
    });
    fallbackNoteFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        noteTextarea.value = evt.target.result;
        loadedFileName = file.name;
        wordCountText.textContent = `${evt.target.result.length} 字`;
        currentFileHandle = null;
        saveStateText.textContent = `已载入: ${file.name}（当前浏览器不支持直接覆写，⌘S 将下载）`;
        saveStateText.className = 'text-amber-400 font-semibold';
        saveBtnText.textContent = '保存笔记 (⌘S)';
      };
      reader.readAsText(file);
      e.target.value = '';
    });
    async function saveNoteDirectly() {
      const content = noteTextarea.value;
      const timeNow = new Date().toLocaleTimeString();
      if (currentFileHandle) {
        try {
          const writable = await currentFileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          saveStateText.textContent = `已于 ${timeNow} 成功保存至: ${currentFileHandle.name}`;
          saveStateText.className = 'text-emerald-400 font-semibold';
          return;
        } catch (err) {
          console.warn('保存遇到阻碍，重新申请文件窗口:', err);
        }
      }
      if ('showSaveFilePicker' in window) {
        try {
          currentFileHandle = await window.showSaveFilePicker({
            suggestedName: loadedFileName || `Note_${new Date().toISOString().slice(0, 10)}.md`,
            types: [{ description: 'Markdown / Text', accept: { 'text/plain': ['.md', '.txt'] } }]
          });
          const writable = await currentFileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          loadedFileName = currentFileHandle.name;
          saveStateText.textContent = `已绑定并于 ${timeNow} 成功保存至: ${currentFileHandle.name}`;
          saveStateText.className = 'text-emerald-400 font-semibold';
          saveBtnText.textContent = '覆写保存 (⌘S)';
        } catch (err) {
          // 用户取消
        }
      } else {
        exportDownloadFallback(content);
      }
    }
    function exportDownloadFallback(content) {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = loadedFileName || `Note_${new Date().toISOString().slice(0, 10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
      saveStateText.textContent = `已于 ${new Date().toLocaleTimeString()} 导出下载`;
      saveStateText.className = 'text-emerald-400 font-semibold';
    }
    saveNoteBtn.addEventListener('click', saveNoteDirectly);
    saveAsNoteBtn.addEventListener('click', async () => {
      currentFileHandle = null;
      await saveNoteDirectly();
    });
    insertTimestampBtn.addEventListener('click', () => {
      const timeStr = `[${formatTime(getCurrentTime())}] `;
      const start = noteTextarea.selectionStart;
      const text = noteTextarea.value;
      noteTextarea.value = text.substring(0, start) + timeStr + text.substring(noteTextarea.selectionEnd);
      noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
      noteTextarea.focus();
      wordCountText.textContent = `${noteTextarea.value.length} 字`;
    });
    // 输入时：字数实时更新 + localStorage 防抖保存（消除输入延迟）
    noteTextarea.addEventListener('input', () => {
      wordCountText.textContent = `${noteTextarea.value.length} 字`;
      if (noteSaveTimer) clearTimeout(noteSaveTimer);
      noteSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem('local_note_backup', noteTextarea.value);
        } catch (e) {}
      }, 300);
    });
    // 恢复备份
    try {
      const savedNote = localStorage.getItem('local_note_backup');
      if (savedNote) {
        noteTextarea.value = savedNote;
        wordCountText.textContent = `${savedNote.length} 字`;
      }
    } catch (e) {}
    // ========== 6. Resizers ==========
    let isResizingH = false;
    waveformResizer.addEventListener('mousedown', (e) => { isResizingH = true; e.preventDefault(); });
    let isResizingV = false;
    panelResizer.addEventListener('mousedown', (e) => { isResizingV = true; e.preventDefault(); });
    window.addEventListener('mousemove', (e) => {
      if (isResizingH) {
        const containerRect = leftPanel.getBoundingClientRect();
        const newHeight = containerRect.bottom - e.clientY;
        if (newHeight > 100 && newHeight < containerRect.height - 120) {
          waveformBox.style.height = `${newHeight}px`;
          invalidateWaveformCache();
          requestDrawWaveform();
        }
      }
      if (isResizingV) {
        const containerWidth = document.getElementById('mainContainer').clientWidth;
        const newWidth = containerWidth - e.clientX;
        if (newWidth > 280 && newWidth < containerWidth - 300) {
          rightPanel.style.width = `${newWidth}px`;
        }
      }
    });
    window.addEventListener('mouseup', () => { isResizingH = false; isResizingV = false; });
    function formatTime(sec) {
      if (isNaN(sec) || sec == null) return '00:00.0';
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }
    window.addEventListener('resize', () => {
      invalidateWaveformCache();
      requestDrawWaveform();
    });
    requestDrawWaveform();
  </script>
</body>
