<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioVisualizer Studio Pro - 极速双栏工作站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .waveform-container { user-select: none; touch-action: none; }
        .resizer-h { cursor: row-resize; height: 6px; background: #1e293b; }
        .resizer-h:hover { background: #0284c7; }
        .resizer-v { cursor: col-resize; width: 6px; background: #1e293b; }
        .resizer-v:hover { background: #0284c7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Header / Top Bar -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </div>
            <h1 class="text-base font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                AudioVisualizer Studio Pro <span class="text-xs px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">Direct File Engine</span>
            </h1>
        </div>

        <!-- File Controls -->
        <div class="flex items-center space-x-3 text-xs">
            <label class="cursor-pointer bg-sky-600 hover:bg-sky-500 text-white font-medium px-3 py-1.5 rounded-md flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-folder-open"></i>
                <span>打开音频/视频文件</span>
                <input type="file" id="mediaFileInput" accept="video/*,audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" class="hidden">
            </label>
            <div class="h-4 w-px bg-slate-700"></div>
            <!-- Save to File Btn -->
            <button id="saveNoteBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-md border border-emerald-600 flex items-center space-x-1.5 transition" title="直接覆盖保存到已绑定文件 (Cmd/Ctrl+S)">
                <i class="fa-solid fa-floppy-disk"></i>
                <span id="saveBtnText">保存笔记 (⌘S)</span>
            </button>
            <button id="saveAsNoteBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1 transition" title="另存为新文件">
                <i class="fa-solid fa-file-export text-sky-400"></i>
                <span>另存为...</span>
            </button>
            <!-- Native Open File Button -->
            <button id="openNativeFileBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition" title="打开本地笔记文件 (.txt / .md)">
                <i class="fa-solid fa-file-import text-amber-400"></i>
                <span>打开/绑定本地文件</span>
            </button>
            <input type="file" id="fallbackNoteFileInput" accept=".txt,.md,.markdown,text/plain" class="hidden">
        </div>
    </header>

    <!-- Main Studio Split Layout -->
    <div id="mainContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Left Panel: Player & Waveform Studio -->
        <div id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-slate-900/50 overflow-hidden">
            
            <!-- Player Window / Cover -->
            <div id="mediaContainer" class="flex-1 bg-black flex items-center justify-center relative overflow-hidden group">
                <video id="mainVideo" class="max-h-full max-w-full object-contain hidden"></video>

                <div id="audioCoverBox" class="flex flex-col items-center justify-center space-y-3 text-slate-500 cursor-pointer w-full h-full">
                    <div class="w-20 h-20 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center shadow-2xl">
                        <i class="fa-solid fa-music text-3xl text-sky-400 animate-pulse"></i>
                    </div>
                    <span id="mediaFileName" class="text-sm font-medium text-slate-400">点击此处或上方按钮打开音视频文件</span>
                </div>
                
                <!-- Custom Floating Controls Overlay -->
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-3">
                    <button id="playPauseBtn" class="text-white hover:text-sky-400 text-xl w-8 h-8 flex items-center justify-center">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <span id="currentTimeDisplay" class="text-xs font-mono text-slate-300">00:00.0 / 00:00.0</span>
                    <input type="range" id="mediaProgressBar" value="0" step="0.001" min="0" max="100" class="flex-1 accent-sky-500 bg-slate-700 h-1.5 rounded cursor-pointer">
                </div>
            </div>

            <!-- Waveform Resizer Bar -->
            <div id="waveformResizer" class="resizer-h flex items-center justify-center border-y border-slate-700/50 shrink-0">
                <div class="w-8 h-1 bg-slate-500 rounded-full"></div>
            </div>

            <!-- Waveform & Controls Region -->
            <div id="waveformBox" class="h-48 bg-slate-950 flex flex-col border-t border-slate-800 shrink-0 relative">
                
                <!-- Waveform Toolbar -->
                <div class="h-9 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 text-xs shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-wave-square text-sky-400 mr-1"></i>高清波形:</span>
                        <button id="zoomOutBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-minus"></i> 缩小
                        </button>
                        <span id="zoomLevelDisplay" class="font-mono text-sky-400">1.0x</span>
                        <button id="zoomInBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> 放大
                        </button>

                        <div class="h-3 w-px bg-slate-700 mx-1"></div>

                        <button id="toggleAutoScrollBtn" class="px-2.5 py-0.5 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-800 rounded flex items-center space-x-1 transition">
                            <i class="fa-solid fa-arrows-to-eye"></i>
                            <span>波形跟随: <b id="autoScrollStatusText" class="text-emerald-400">开</b></span>
                        </button>
                    </div>

                    <!-- AB Loop & Clear Controls -->
                    <div class="flex items-center space-x-2">
                        <button id="toggleLoopBtn" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>AB 循环: <b id="loopStatusText" class="text-rose-400">关</b></span>
                        </button>
                        <button id="clearABBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清除 A-B</span>
                        </button>
                    </div>
                </div>

                <!-- Canvas Waveform Container -->
                <div id="waveformScrollContainer" class="flex-1 overflow-x-auto overflow-y-hidden relative waveform-container bg-slate-950">
                    <canvas id="waveformCanvas" class="h-full block cursor-crosshair"></canvas>
                </div>

                <!-- AB Precision Fine Tuning Bar -->
                <div class="h-8 bg-slate-900/80 border-t border-slate-800/80 flex items-center justify-between px-3 text-xs font-mono shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="text-emerald-400">A 点:</span>
                        <input type="number" id="inputTimeA" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-emerald-400">
                        <button id="aMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="aPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                    <div class="text-slate-500 text-[10px]">单击设A点(+3s为B) | 拖拽把手单独微调 | 按选区平移</div>
                    <div class="flex items-center space-x-2">
                        <span class="text-rose-400">B 点:</span>
                        <input type="number" id="inputTimeB" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-rose-400">
                        <button id="bMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="bPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vertical Split Resizer -->
        <div id="panelResizer" class="resizer-v hidden md:block border-x border-slate-700/50 shrink-0"></div>

        <!-- Right Panel: Note Editor -->
        <div id="rightPanel" class="w-full md:w-[420px] flex flex-col bg-slate-900 shrink-0 border-l border-slate-800">
            <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-sm"></i>
                    <span class="text-xs font-bold text-slate-200">音视频笔记工作台</span>
                </div>
                <button id="insertTimestampBtn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs flex items-center space-x-1 transition">
                    <i class="fa-regular fa-clock"></i>
                    <span>插入当前时间戳</span>
                </button>
            </div>

            <div class="flex-1 p-3 bg-slate-900 flex flex-col">
                <textarea id="noteTextarea" class="w-full flex-1 bg-slate-950 text-slate-100 p-3 rounded-lg border border-slate-800 focus:border-sky-500 focus:outline-none font-sans text-sm resize-none leading-relaxed" placeholder="在此输入笔记内容... 点击右上方“打开/绑定本地文件”可链接本地 .txt/.md 文件，之后按 ⌘S 即可静默覆写保存。"></textarea>
            </div>

            <div class="h-8 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-[11px] text-slate-500">
                <span id="saveStateText" class="text-amber-400/80">未绑定文件（请先点击右上方打开本地文件）</span>
                <span id="wordCountText">0 字</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const mediaFileInput = document.getElementById('mediaFileInput');
        const mainVideo = document.getElementById('mainVideo');
        const audioCoverBox = document.getElementById('audioCoverBox');
        const mediaFileName = document.getElementById('mediaFileName');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const mediaProgressBar = document.getElementById('mediaProgressBar');

        const waveformScrollContainer = document.getElementById('waveformScrollContainer');
        const waveformCanvas = document.getElementById('waveformCanvas');
        const ctx = waveformCanvas.getContext('2d');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
        const toggleAutoScrollBtn = document.getElementById('toggleAutoScrollBtn');
        const autoScrollStatusText = document.getElementById('autoScrollStatusText');

        const toggleLoopBtn = document.getElementById('toggleLoopBtn');
        const loopStatusText = document.getElementById('loopStatusText');
        const clearABBtn = document.getElementById('clearABBtn');

        const inputTimeA = document.getElementById('inputTimeA');
        const inputTimeB = document.getElementById('inputTimeB');
        const aMinusBtn = document.getElementById('aMinusBtn');
        const aPlusBtn = document.getElementById('aPlusBtn');
        const bMinusBtn = document.getElementById('bMinusBtn');
        const bPlusBtn = document.getElementById('bPlusBtn');

        const noteTextarea = document.getElementById('noteTextarea');
        const saveNoteBtn = document.getElementById('saveNoteBtn');
        const saveBtnText = document.getElementById('saveBtnText');
        const saveAsNoteBtn = document.getElementById('saveAsNoteBtn');
        const openNativeFileBtn = document.getElementById('openNativeFileBtn');
        const fallbackNoteFileInput = document.getElementById('fallbackNoteFileInput');
        const insertTimestampBtn = document.getElementById('insertTimestampBtn');
        const saveStateText = document.getElementById('saveStateText');
        const wordCountText = document.getElementById('wordCountText');

        const waveformResizer = document.getElementById('waveformResizer');
        const waveformBox = document.getElementById('waveformBox');
        const panelResizer = document.getElementById('panelResizer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');

        // Web Audio API Native Engine
        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;

        let mediaDuration = 0;
        let zoomLevel = 1.0;
        let isAutoScrollEnabled = true;
        let pointA = null;
        let pointB = null;
        let isLooping = false;

        let rawChannelData = null;
        let isMouseDown = false;
        let dragMode = null;
        let dragStartX = 0;
        let dragStartA = 0;
        let dragStartB = 0;
        let dragOffsetTimeA = 0;
        let dragRangeDuration = 0;
        let renderPending = false;
        
        // Critical File Handle Store for Silent Overwrite
        let globalFileHandle = null;
        let loadedFileName = '';

        // --- 1. Load Audio ---
        async function loadMediaFile(file) {
            try {
                stopAudio();
                const arrayBuffer = await file.arrayBuffer();
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                mediaDuration = audioBuffer.duration;
                rawChannelData = audioBuffer.getChannelData(0);
                
                mediaFileName.textContent = file.name;
                audioCoverBox.classList.remove('hidden');
                audioCoverBox.classList.add('flex');
                mainVideo.classList.add('hidden');

                requestDrawWaveform();
                updateProgress();
            } catch (err) {
                console.error('音频解码失败:', err);
                alert('无法解析该音视频文件，请尝试其他 mp3 / wav / mp4 格式。');
            }
        }

        mediaFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadMediaFile(file);
        });

        // --- 2. Playback Control ---
        function playAudio(offset = 0) {
            if (!audioBuffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            stopAudio();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
                if (offset < pointA || offset >= pointB) offset = pointA;
                sourceNode.loop = true;
                sourceNode.loopStart = pointA;
                sourceNode.loopEnd = pointB;
            } else {
                sourceNode.loop = false;
            }

            sourceNode.connect(audioCtx.destination);
            sourceNode.start(0, offset);

            startTime = audioCtx.currentTime - offset;
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

            sourceNode.onended = () => {
                if (!isLooping && isPlaying && (getCurrentTime() >= mediaDuration - 0.1)) {
                    stopAudio();
                    pauseOffset = 0;
                }
            };

            requestAnimationFrame(trackProgress);
        }

        function stopAudio() {
            if (sourceNode) {
                try { sourceNode.stop(); sourceNode.disconnect(); } catch(e){}
                sourceNode = null;
            }
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

        function getCurrentTime() {
            if (!isPlaying) return pauseOffset;
            let cur = audioCtx.currentTime - startTime;
            if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
                if (cur >= pointB) {
                    const len = pointB - pointA;
                    cur = pointA + ((cur - pointA) % len);
                }
            }
            return Math.min(mediaDuration, Math.max(0, cur));
        }

        function seekAudio(targetTime) {
            pauseOffset = Math.max(0, Math.min(mediaDuration, targetTime));
            if (isPlaying) {
                playAudio(pauseOffset);
            } else {
                updateProgress();
                requestDrawWaveform();
            }
        }

        function togglePlay() {
            if (!audioBuffer) return;
            if (isPlaying) {
                pauseOffset = getCurrentTime();
                stopAudio();
            } else {
                playAudio(pauseOffset);
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        audioCoverBox.addEventListener('click', togglePlay);

        function trackProgress() {
            if (!isPlaying) return;
            updateProgress();
            requestDrawWaveform();
            requestAnimationFrame(trackProgress);
        }

        function updateProgress() {
            const cur = getCurrentTime();
            currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(mediaDuration)}`;
            mediaProgressBar.value = mediaDuration ? (cur / mediaDuration) * 100 : 0;
        }

        mediaProgressBar.addEventListener('input', (e) => {
            const dur = mediaDuration;
            if (dur) seekAudio((e.target.value / 100) * dur);
        });

        // --- 3. Ultra-Crisp Waveform Rendering ---
        function requestDrawWaveform() {
            if (!renderPending) {
                renderPending = true;
                requestAnimationFrame(() => {
                    drawWaveform();
                    renderPending = false;
                });
            }
        }

        function drawWaveform() {
            const containerWidth = waveformScrollContainer.clientWidth;
            const canvasWidth = Math.max(containerWidth, containerWidth * zoomLevel);
            const canvasHeight = waveformScrollContainer.clientHeight || 120;

            const dpr = window.devicePixelRatio || 1;
            waveformCanvas.width = canvasWidth * dpr;
            waveformCanvas.height = canvasHeight * dpr;
            waveformCanvas.style.width = canvasWidth + 'px';
            waveformCanvas.style.height = canvasHeight + 'px';

            ctx.scale(dpr, dpr);
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            if (!rawChannelData) {
                ctx.fillStyle = '#475569';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('请点击上方打开音频文件，此处将呈现高精度绝无偏差波形', canvasWidth / 2, canvasHeight / 2);
                return;
            }

            const midY = canvasHeight / 2;
            const maxBarHeight = midY * 0.88;
            const totalSamples = rawChannelData.length;
            const step = Math.ceil(totalSamples / canvasWidth);

            ctx.fillStyle = '#38bdf8';
            for (let i = 0; i < canvasWidth; i++) {
                let min = 1.0, max = -1.0;
                const start = i * step;
                for (let j = 0; j < step && (start + j) < totalSamples; j++) {
                    const val = rawChannelData[start + j];
                    if (val < min) min = val;
                    if (val > max) max = val;
                }
                const amp = Math.max(Math.abs(min), Math.abs(max));
                const h = amp * maxBarHeight;
                ctx.fillRect(i, midY - h, 1, Math.max(1, h * 2));
            }

            ctx.strokeStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(0, midY);
            ctx.lineTo(canvasWidth, midY);
            ctx.stroke();

            const duration = mediaDuration;
            if (duration > 0) {
                if (pointA !== null && pointB !== null) {
                    const xA = (pointA / duration) * canvasWidth;
                    const xB = (pointB / duration) * canvasWidth;
                    const startX = Math.min(xA, xB);
                    const endX = Math.max(xA, xB);

                    ctx.fillStyle = 'rgba(14, 165, 233, 0.25)';
                    ctx.fillRect(startX, 0, endX - startX, canvasHeight);

                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(startX, 0, endX - startX, 2);
                    ctx.fillRect(startX, canvasHeight - 2, endX - startX, 2);

                    // Line & Handle A
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(xA, 0);
                    ctx.lineTo(xA, canvasHeight);
                    ctx.stroke();

                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(xA - 7, 0, 14, 18);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', xA, 13);

                    // Line & Handle B
                    ctx.strokeStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.moveTo(xB, 0);
                    ctx.lineTo(xB, canvasHeight);
                    ctx.stroke();

                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(xB - 7, 0, 14, 18);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('B', xB, 13);
                }

                const playX = (getCurrentTime() / duration) * canvasWidth;
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(playX, 0);
                ctx.lineTo(playX, canvasHeight);
                ctx.stroke();

                if (isAutoScrollEnabled && zoomLevel > 1.0) {
                    const containerWidth = waveformScrollContainer.clientWidth;
                    waveformScrollContainer.scrollLeft = playX - containerWidth / 2;
                }
            }
        }

        // --- 4. Precise Click & Dragging Logic ---
        function getCanvasTimeFromEvent(e) {
            const rect = waveformCanvas.getBoundingClientRect();
            const cssWidth = waveformCanvas.clientWidth;
            const clickX = (e.clientX - rect.left);
            const duration = mediaDuration;
            if (!duration || cssWidth === 0) return 0;
            return Math.max(0, Math.min(duration, (clickX / cssWidth) * duration));
        }

        zoomInBtn.addEventListener('click', () => { zoomLevel = Math.min(20.0, zoomLevel + 1.0); zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x'; requestDrawWaveform(); });
        zoomOutBtn.addEventListener('click', () => { zoomLevel = Math.max(1.0, zoomLevel - 1.0); zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x'; requestDrawWaveform(); });
        toggleAutoScrollBtn.addEventListener('click', () => { isAutoScrollEnabled = !isAutoScrollEnabled; autoScrollStatusText.textContent = isAutoScrollEnabled ? '开' : '关'; autoScrollStatusText.className = isAutoScrollEnabled ? 'text-emerald-400' : 'text-rose-400'; });

        waveformCanvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            dragStartX = e.clientX;
            if (!mediaDuration) return;

            const clickTime = getCanvasTimeFromEvent(e);
            const cssWidth = waveformCanvas.clientWidth;
            const clickX = e.clientX - waveformCanvas.getBoundingClientRect().left;

            if (pointA !== null && pointB !== null) {
                const xA = (pointA / mediaDuration) * cssWidth;
                const xB = (pointB / mediaDuration) * cssWidth;

                if (Math.abs(clickX - xA) <= 12) { dragMode = 'A'; return; }
                if (Math.abs(clickX - xB) <= 12) { dragMode = 'B'; return; }
                if (clickX > Math.min(xA, xB) && clickX < Math.max(xA, xB)) {
                    dragMode = 'RANGE';
                    dragOffsetTimeA = clickTime - pointA;
                    dragRangeDuration = pointB - pointA;
                    waveformCanvas.style.cursor = 'grabbing';
                    return;
                }
            }
            dragMode = 'SELECT';
            dragStartA = clickTime;
            dragStartB = clickTime;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mediaDuration) return;
            const currentTime = getCanvasTimeFromEvent(e);
            const cssWidth = waveformCanvas.clientWidth;
            const currentX = e.clientX - waveformCanvas.getBoundingClientRect().left;

            if (!isMouseDown && pointA !== null && pointB !== null) {
                const xA = (pointA / mediaDuration) * cssWidth;
                const xB = (pointB / mediaDuration) * cssWidth;
                if (Math.abs(currentX - xA) <= 12 || Math.abs(currentX - xB) <= 12) {
                    waveformCanvas.style.cursor = 'col-resize';
                } else if (currentX > Math.min(xA, xB) && currentX < Math.max(xA, xB)) {
                    waveformCanvas.style.cursor = 'grab';
                } else {
                    waveformCanvas.style.cursor = 'crosshair';
                }
            }

            if (!isMouseDown || !dragMode) return;

            if (dragMode === 'A') {
                pointA = Math.min(currentTime, pointB - 0.1);
            } else if (dragMode === 'B') {
                pointB = Math.max(currentTime, pointA + 0.1);
            } else if (dragMode === 'RANGE') {
                let newA = currentTime - dragOffsetTimeA;
                if (newA < 0) newA = 0;
                if (newA + dragRangeDuration > mediaDuration) newA = mediaDuration - dragRangeDuration;
                pointA = newA;
                pointB = newA + dragRangeDuration;
            } else if (dragMode === 'SELECT') {
                pointA = Math.min(dragStartA, currentTime);
                pointB = Math.max(dragStartA, currentTime);
            }

            enforceABConstraint();
            updateABInputs();
            requestDrawWaveform();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            const moveDist = Math.abs(e.clientX - dragStartX);

            if (dragMode === 'SELECT' && moveDist < 5) {
                if (mediaDuration > 0) {
                    const clickTime = getCanvasTimeFromEvent(e);
                    pointA = clickTime;
                    pointB = Math.min(mediaDuration, clickTime + 3.0); // Exact 3s gap
                    seekAudio(clickTime);
                }
            }
            if (dragMode === 'RANGE') waveformCanvas.style.cursor = 'grab';

            isMouseDown = false;
            dragMode = null;
            enforceABConstraint();
            updateABInputs();
            if (isLooping && isPlaying) playAudio(getCurrentTime());
            requestDrawWaveform();
        });

        function enforceABConstraint() {
            if (pointA !== null && pointB !== null) {
                if (pointB < pointA) { const t = pointA; pointA = pointB; pointB = t; }
                if (pointB - pointA < 0.1) pointB = pointA + 0.1;
            }
        }

        toggleLoopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopStatusText.textContent = isLooping ? '开' : '关';
            loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
            if (isPlaying) playAudio(getCurrentTime());
        });

        clearABBtn.addEventListener('click', () => {
            pointA = null; pointB = null; isLooping = false;
            loopStatusText.textContent = '关'; loopStatusText.className = 'text-rose-400';
            updateABInputs();
            if (isPlaying) playAudio(getCurrentTime());
            requestDrawWaveform();
        });

        function updateABInputs() {
            inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
            inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
        }

        inputTimeA.addEventListener('change', () => { pointA = parseFloat(inputTimeA.value) || 0; enforceABConstraint(); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); });
        inputTimeB.addEventListener('change', () => { pointB = parseFloat(inputTimeB.value) || 0; enforceABConstraint(); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); });
        aMinusBtn.addEventListener('click', () => { if (pointA !== null) { pointA = Math.max(0, pointA - 0.1); enforceABConstraint(); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); } });
        aPlusBtn.addEventListener('click', () => { if (pointA !== null) { pointA += 0.1; enforceABConstraint(); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); } });
        bMinusBtn.addEventListener('click', () => { if (pointB !== null) { pointB = Math.max(pointA + 0.1, pointB - 0.1); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); } });
        bPlusBtn.addEventListener('click', () => { if (pointB !== null) { pointB += 0.1; enforceABConstraint(); updateABInputs(); if(isPlaying)playAudio(getCurrentTime()); requestDrawWaveform(); } });

        // --- 5. Zero-Lag Textarea & Silent File System ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== noteTextarea && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlay();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveNoteDirectly();
            }
        });

        // Open Native File & Lock File Handle Permanently
        openNativeFileBtn.addEventListener('click', async () => {
            if ('showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({ 
                        types: [{ description: 'Markdown/Text', accept: { 'text/plain': ['.md', '.txt'] } }] 
                    });
                    globalFileHandle = handle;
                    const file = await handle.getFile();
                    loadedFileName = file.name;
                    const text = await file.text();
                    
                    noteTextarea.value = text;
                    wordCountText.textContent = `${text.length} 字`;
                    saveStateText.textContent = `已成功绑定原文件: ${file.name} (按 ⌘S 即可直接覆写)`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    saveBtnText.textContent = '覆写保存 (⌘S)';
                } catch (e) {
                    console.log('取消选择');
                }
            } else {
                fallbackNoteFileInput.click();
            }
        });

        fallbackNoteFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    noteTextarea.value = evt.target.result;
                    loadedFileName = file.name;
                    wordCountText.textContent = `${evt.target.result.length} 字`;
                    saveStateText.textContent = `已载入文本: ${file.name}`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                };
                reader.readAsText(file);
            }
        });

        async function saveNoteDirectly() {
            const content = noteTextarea.value;
            const timeNow = new Date().toLocaleTimeString();

            // 1. Silent Direct Overwrite via Native FileHandle
            if (globalFileHandle) {
                try {
                    const writable = await globalFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    saveStateText.textContent = `已于 ${timeNow} 静默覆写保存至原文件: ${globalFileHandle.name}`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    return;
                } catch (e) {
                    console.warn('句柄权限丢失，准备重新弹窗申请绑定', e);
                }
            }

            // 2. First-time Binding Prompt
            if ('showSaveFilePicker' in window) {
                try {
                    globalFileHandle = await window.showSaveFilePicker({ 
                        suggestedName: loadedFileName || `Note_${new Date().toISOString().slice(0, 10)}.md`, 
                        types: [{ description: 'Markdown/Text', accept: { 'text/plain': ['.md', '.txt'] } }] 
                    });
                    const writable = await globalFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    saveStateText.textContent = `已绑定并于 ${timeNow} 成功保存至: ${globalFileHandle.name}`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    saveBtnText.textContent = '覆写保存 (⌘S)';
                    return;
                } catch (e) {
                    return;
                }
            }

            // 3. Fallback Export Download
            downloadTextFile(content, loadedFileName || `Note_${new Date().toISOString().slice(0, 10)}.txt`);
            saveStateText.textContent = `已于 ${timeNow} 导出下载到本地`;
            saveStateText.className = 'text-emerald-400 font-semibold';
        }

        function downloadTextFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        saveNoteBtn.addEventListener('click', saveNoteDirectly);
        saveAsNoteBtn.addEventListener('click', async () => { globalFileHandle = null; await saveNoteDirectly(); });

        insertTimestampBtn.addEventListener('click', () => {
            const timeStr = `[${formatTime(getCurrentTime())}] `;
            const start = noteTextarea.selectionStart;
            const text = noteTextarea.value;
            noteTextarea.value = text.substring(0, start) + timeStr + text.substring(noteTextarea.selectionEnd);
            noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
            noteTextarea.focus();
        });

        // Instant Zero-Lag Typing Response
        noteTextarea.addEventListener('input', () => {
            wordCountText.textContent = `${noteTextarea.value.length} 字`;
        });

        // --- 6. Resizable Panels ---
        let isResizingH = false;
        waveformResizer.addEventListener('mousedown', (e) => { isResizingH = true; e.preventDefault(); });

        let isResizingV = false;
        panelResizer.addEventListener('mousedown', (e) => { isResizingV = true; e.preventDefault(); });

        window.addEventListener('mousemove', (e) => {
            if (isResizingH) {
                const containerRect = leftPanel.getBoundingClientRect();
                const newHeight = containerRect.bottom - e.clientY;
                if (newHeight > 100 && newHeight < containerRect.height - 120) {
                    waveformBox.style.height = `${newHeight}px`;
                    requestDrawWaveform();
                }
            }
            if (isResizingV) {
                const containerWidth = document.getElementById('mainContainer').clientWidth;
                const newWidth = containerWidth - e.clientX;
                if (newWidth > 280 && newWidth < containerWidth - 300) {
                    rightPanel.style.width = `${newWidth}px`;
                    requestDrawWaveform();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isResizingH = false;
            isResizingV = false;
        });

        function formatTime(sec) {
            if (isNaN(sec)) return '00:00.0';
            const m = Math.floor(sec / 60);
            const s = (sec % 60).toFixed(1);
            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        window.addEventListener('resize', requestDrawWaveform);
        requestDrawWaveform();
    </script>
</body>
</html>
