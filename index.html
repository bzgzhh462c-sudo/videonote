<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioVisualizer Studio Pro - 视频分析与笔记工作站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Canvas Waveform Box */
        .waveform-container {
            user-select: none;
            touch-action: none;
        }
        /* Resize handles */
        .resizer-h {
            cursor: row-resize;
            height: 6px;
        }
        .resizer-v {
            cursor: col-resize;
            width: 6px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Header / Top Bar -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-photo-film text-lg"></i>
            </div>
            <h1 class="text-base font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                AudioVisualizer Studio Pro <span class="text-xs px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">Pure Video</span>
            </h1>
        </div>

        <!-- File Controls -->
        <div class="flex items-center space-x-3 text-xs">
            <label class="cursor-pointer bg-sky-600 hover:bg-sky-500 text-white font-medium px-3 py-1.5 rounded-md flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-folder-open"></i>
                <span>打开本地视频</span>
                <input type="file" id="videoFileInput" accept="video/*" class="hidden">
            </label>
            <div class="h-4 w-px bg-slate-700"></div>
            <button id="exportNoteBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-floppy-disk text-sky-400"></i>
                <span>保存笔记</span>
            </button>
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-file-import text-amber-400"></i>
                <span>导入笔记</span>
                <input type="file" id="importNoteInput" accept=".md,.txt" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Studio Split Layout -->
    <div id="mainContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Left Panel: Video Analysis Studio -->
        <div id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-slate-900/50 overflow-hidden">
            
            <!-- Video Player Window -->
            <div id="videoContainer" class="flex-1 bg-black flex items-center justify-center relative overflow-hidden group">
                <video id="mainVideo" class="max-h-full max-w-full object-contain"></video>
                
                <!-- Custom Floating Video Controls Overlay -->
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-3">
                    <button id="playPauseBtn" class="text-white hover:text-sky-400 text-xl w-8 h-8 flex items-center justify-center">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <span id="currentTimeDisplay" class="text-xs font-mono text-slate-300">00:00.0 / 00:00.0</span>
                    <input type="range" id="videoProgressBar" value="0" step="0.01" class="flex-1 accent-sky-500 bg-slate-700 h-1.5 rounded cursor-pointer">
                    <button id="muteBtn" class="text-slate-300 hover:text-white text-sm">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>

            <!-- Waveform Resizer Bar -->
            <div id="waveformResizer" class="resizer-h bg-slate-800 hover:bg-sky-500 transition-colors flex items-center justify-center border-y border-slate-700/50">
                <div class="w-8 h-1 bg-slate-600 rounded-full"></div>
            </div>

            <!-- Waveform & Controls Region -->
            <div id="waveformBox" class="h-48 bg-slate-950 flex flex-col border-t border-slate-800 shrink-0 relative">
                
                <!-- Waveform Toolbar -->
                <div class="h-9 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 text-xs">
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-wave-square text-sky-400 mr-1"></i>波形视口:</span>
                        <button id="zoomOutBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-minus"></i> 缩小
                        </button>
                        <span id="zoomLevelDisplay" class="font-mono text-sky-400">1.0x</span>
                        <button id="zoomInBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> 放大
                        </button>
                    </div>

                    <!-- AB Loop Controls -->
                    <div class="flex items-center space-x-2">
                        <button id="setPointABtn" class="px-2 py-0.5 bg-emerald-950 hover:bg-emerald-900 text-emerald-400 border border-emerald-800 rounded font-mono">
                            设定 A 点
                        </button>
                        <button id="setPointBBtn" class="px-2 py-0.5 bg-rose-950 hover:bg-rose-900 text-rose-400 border border-rose-800 rounded font-mono">
                            设定 B 点
                        </button>
                        <button id="toggleLoopBtn" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>AB 循环: <b id="loopStatusText" class="text-rose-400">关</b></span>
                        </button>
                        <button id="clearABBtn" class="px-1.5 py-0.5 text-slate-400 hover:text-slate-200" title="清除 AB 点">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- Canvas Waveform Canvas Container -->
                <div id="waveformScrollContainer" class="flex-1 overflow-x-auto overflow-y-hidden relative waveform-container bg-slate-950">
                    <canvas id="waveformCanvas" class="h-full block cursor-crosshair"></canvas>
                </div>

                <!-- AB Precision Fine Tuning Bar -->
                <div class="h-8 bg-slate-900/80 border-t border-slate-800/80 flex items-center justify-between px-3 text-xs font-mono">
                    <div class="flex items-center space-x-2">
                        <span class="text-emerald-400">A 点:</span>
                        <input type="number" id="inputTimeA" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-emerald-400">
                        <button id="aMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="aPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                    <div class="text-slate-500 text-[10px]">按住波形长按拖拽可直接划定 AB 选区</div>
                    <div class="flex items-center space-x-2">
                        <span class="text-rose-400">B 点:</span>
                        <input type="number" id="inputTimeB" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-rose-400">
                        <button id="bMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="bPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vertical Split Resizer between Video and Note Panel -->
        <div id="panelResizer" class="resizer-v bg-slate-800 hover:bg-sky-500 transition-colors hidden md:block border-x border-slate-700/50"></div>

        <!-- Right Panel: Note Editor & Speech Transcription -->
        <div id="rightPanel" class="w-full md:w-[420px] flex flex-col bg-slate-900 shrink-0 border-l border-slate-800">
            
            <!-- Speech Recognition Header Bar -->
            <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-closed-captioning text-sky-400"></i>
                    <span class="text-xs font-bold text-slate-200">视频内容实时语音转写</span>
                </div>
                <button id="toggleSttBtn" class="px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-microphone"></i>
                    <span id="sttStatusText">开启识别</span>
                </button>
            </div>

            <!-- Speech Output Box -->
            <div id="transcriptBox" class="h-32 bg-slate-950 p-3 overflow-y-auto border-b border-slate-800 text-xs space-y-1.5 font-sans">
                <div class="text-slate-500 italic">视频播放时开启转写，听到内容将实时输出带时间戳字幕...</div>
            </div>

            <!-- Note Editor Header -->
            <div class="p-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400"></i>
                    <span class="text-xs font-bold text-slate-200">视频笔记工作台</span>
                </div>
                <button id="insertTimestampBtn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs flex items-center space-x-1">
                    <i class="fa-regular fa-clock"></i>
                    <span>插入当前时间戳</span>
                </button>
            </div>

            <!-- Note Textarea -->
            <div class="flex-1 p-3 bg-slate-900 flex flex-col">
                <textarea id="noteTextarea" class="w-full flex-1 bg-slate-950 text-slate-100 p-3 rounded-lg border border-slate-800 focus:border-sky-500 focus:outline-none font-sans text-sm resize-none leading-relaxed" placeholder="在此输入笔记内容... 点击右上方按钮可随时插入带有播放时间的快捷跳转链接 [MM:SS]"></textarea>
            </div>

            <!-- Note Status Footer -->
            <div class="h-7 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-[11px] text-slate-500">
                <span id="saveStateText">已自动暂存至本地缓存</span>
                <span id="wordCountText">0 字</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // DOM Elements
        const videoFileInput = document.getElementById('videoFileInput');
        const mainVideo = document.getElementById('mainVideo');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const videoProgressBar = document.getElementById('videoProgressBar');
        const muteBtn = document.getElementById('muteBtn');

        const waveformScrollContainer = document.getElementById('waveformScrollContainer');
        const waveformCanvas = document.getElementById('waveformCanvas');
        const ctx = waveformCanvas.getContext('2d');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');

        const setPointABtn = document.getElementById('setPointABtn');
        const setPointBBtn = document.getElementById('setPointBBtn');
        const toggleLoopBtn = document.getElementById('toggleLoopBtn');
        const loopStatusText = document.getElementById('loopStatusText');
        const clearABBtn = document.getElementById('clearABBtn');

        const inputTimeA = document.getElementById('inputTimeA');
        const inputTimeB = document.getElementById('inputTimeB');
        const aMinusBtn = document.getElementById('aMinusBtn');
        const aPlusBtn = document.getElementById('aPlusBtn');
        const bMinusBtn = document.getElementById('bMinusBtn');
        const bPlusBtn = document.getElementById('bPlusBtn');

        const noteTextarea = document.getElementById('noteTextarea');
        const exportNoteBtn = document.getElementById('exportNoteBtn');
        const importNoteInput = document.getElementById('importNoteInput');
        const insertTimestampBtn = document.getElementById('insertTimestampBtn');
        const saveStateText = document.getElementById('saveStateText');
        const wordCountText = document.getElementById('wordCountText');

        const toggleSttBtn = document.getElementById('toggleSttBtn');
        const sttStatusText = document.getElementById('sttStatusText');
        const transcriptBox = document.getElementById('transcriptBox');

        // Layout Resizers
        const waveformResizer = document.getElementById('waveformResizer');
        const waveformBox = document.getElementById('waveformBox');
        const panelResizer = document.getElementById('panelResizer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');

        // Application State
        let audioBuffer = null;
        let zoomLevel = 1.0;
        let pointA = null;
        let pointB = null;
        let isLooping = false;
        let isDraggingAB = null; // 'A' or 'B' or 'SELECT'
        let dragStartX = 0;

        // Speech Recognition State
        let recognition = null;
        let isTranscribing = false;

        // --- 1. Audio Processing & Waveform Extraction ---
        async function loadVideoAudio(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                drawWaveform();
            } catch (err) {
                console.warn('音频轨解析提示：视频可能无音频轨或格式不兼容。', err);
                audioBuffer = null;
                drawWaveform();
            }
        }

        function drawWaveform() {
            const containerWidth = waveformScrollContainer.clientWidth;
            const canvasWidth = Math.max(containerWidth, containerWidth * zoomLevel);
            const canvasHeight = waveformScrollContainer.clientHeight || 120;

            waveformCanvas.width = canvasWidth;
            waveformCanvas.height = canvasHeight;

            // Clear Background
            ctx.fillStyle = '#020617'; // slate-950
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            if (!audioBuffer) {
                ctx.fillStyle = '#475569';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('选择或拖入视频后在此呈现极清晰波形', canvasWidth / 2, canvasHeight / 2);
                return;
            }

            const rawData = audioBuffer.getChannelData(0);
            const totalSamples = rawData.length;
            const step = Math.ceil(totalSamples / canvasWidth);
            const midY = canvasHeight / 2;

            // Calculate Peaks & Normalize Amplitude to Fill Container
            let maxAmp = 0;
            const peaks = new Float32Array(canvasWidth);
            for (let i = 0; i < canvasWidth; i++) {
                let min = 1.0, max = -1.0;
                const start = i * step;
                for (let j = 0; j < step && (start + j) < totalSamples; j++) {
                    const val = rawData[start + j];
                    if (val < min) min = val;
                    if (val > max) max = val;
                }
                const amp = Math.max(Math.abs(min), Math.abs(max));
                peaks[i] = amp;
                if (amp > maxAmp) maxAmp = amp;
            }

            const scale = maxAmp > 0 ? (midY * 0.85) / maxAmp : midY * 0.85;

            // Draw Clean Normalized Waveform Paths
            ctx.fillStyle = '#38bdf8'; // sky-400
            for (let i = 0; i < canvasWidth; i++) {
                const h = peaks[i] * scale;
                ctx.fillRect(i, midY - h, 1, h * 2 || 1);
            }

            // Draw Center Reference Line
            ctx.strokeStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(0, midY);
            ctx.lineTo(canvasWidth, midY);
            ctx.stroke();

            // Draw AB Selection Area & Handles
            const duration = mainVideo.duration || audioBuffer.duration;
            if (duration > 0) {
                if (pointA !== null && pointB !== null) {
                    const xA = (pointA / duration) * canvasWidth;
                    const xB = (pointB / duration) * canvasWidth;
                    const startX = Math.min(xA, xB);
                    const endX = Math.max(xA, xB);

                    // Highlight Range
                    ctx.fillStyle = 'rgba(14, 165, 233, 0.2)';
                    ctx.fillRect(startX, 0, endX - startX, canvasHeight);

                    // Line A
                    ctx.strokeStyle = '#10b981'; // emerald-500
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(xA, 0);
                    ctx.lineTo(xA, canvasHeight);
                    ctx.stroke();

                    // Handle A
                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(xA - 4, 0, 8, 14);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', xA, 11);

                    // Line B
                    ctx.strokeStyle = '#f43f5e'; // rose-500
                    ctx.beginPath();
                    ctx.moveTo(xB, 0);
                    ctx.lineTo(xB, canvasHeight);
                    ctx.stroke();

                    // Handle B
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(xB - 4, 0, 8, 14);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('B', xB, 11);
                }

                // Draw Current Playhead Indicator
                const playX = (mainVideo.currentTime / duration) * canvasWidth;
                ctx.strokeStyle = '#f59e0b'; // amber-500
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(playX, 0);
                ctx.lineTo(playX, canvasHeight);
                ctx.stroke();
            }
        }

        // --- 2. Video Player & Progress Interactions ---
        videoFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                mainVideo.src = url;
                loadVideoAudio(file);
            }
        });

        playPauseBtn.addEventListener('click', togglePlay);
        mainVideo.addEventListener('click', togglePlay);

        function togglePlay() {
            if (mainVideo.paused) {
                mainVideo.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                mainVideo.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        mainVideo.addEventListener('timeupdate', () => {
            const cur = mainVideo.currentTime;
            const dur = mainVideo.duration || 0;

            // Format Time
            currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
            videoProgressBar.value = dur ? (cur / dur) * 100 : 0;

            // AB Loop Logic
            if (isLooping && pointA !== null && pointB !== null) {
                const minAB = Math.min(pointA, pointB);
                const maxAB = Math.max(pointA, pointB);
                if (cur >= maxAB || cur < minAB) {
                    mainVideo.currentTime = minAB;
                }
            }

            // Auto-scroll Waveform Container to Follow Playhead
            if (zoomLevel > 1.0 && dur > 0) {
                const canvasWidth = waveformCanvas.width;
                const playX = (cur / dur) * canvasWidth;
                const containerWidth = waveformScrollContainer.clientWidth;
                waveformScrollContainer.scrollLeft = playX - containerWidth / 2;
            }

            drawWaveform();
        });

        videoProgressBar.addEventListener('input', (e) => {
            const dur = mainVideo.duration || 0;
            if (dur) {
                mainVideo.currentTime = (e.target.value / 100) * dur;
            }
        });

        // --- 3. Waveform Zoom & Drag AB Selection ---
        zoomInBtn.addEventListener('click', () => {
            zoomLevel = Math.min(20.0, zoomLevel + 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            drawWaveform();
        });

        zoomOutBtn.addEventListener('click', () => {
            zoomLevel = Math.max(1.0, zoomLevel - 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            drawWaveform();
        });

        waveformCanvas.addEventListener('mousedown', (e) => {
            const rect = waveformCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const duration = mainVideo.duration || 0;
            if (!duration) return;

            const clickTime = (clickX / waveformCanvas.width) * duration;

            if (pointA !== null && pointB !== null) {
                const xA = (pointA / duration) * waveformCanvas.width;
                const xB = (pointB / duration) * waveformCanvas.width;

                if (Math.abs(clickX - xA) < 10) {
                    isDraggingAB = 'A';
                    return;
                }
                if (Math.abs(clickX - xB) < 10) {
                    isDraggingAB = 'B';
                    return;
                }
            }

            // Otherwise, Start Drag-Selecting
            isDraggingAB = 'SELECT';
            dragStartX = clickX;
            pointA = clickTime;
            pointB = clickTime;
            updateABInputs();
            drawWaveform();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingAB) return;
            const rect = waveformCanvas.getBoundingClientRect();
            const currentX = Math.max(0, Math.min(e.clientX - rect.left, waveformCanvas.width));
            const duration = mainVideo.duration || 0;
            if (!duration) return;

            const currentTime = (currentX / waveformCanvas.width) * duration;

            if (isDraggingAB === 'A') {
                pointA = currentTime;
            } else if (isDraggingAB === 'B') {
                pointB = currentTime;
            } else if (isDraggingAB === 'SELECT') {
                pointB = currentTime;
            }

            updateABInputs();
            drawWaveform();
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingAB === 'SELECT') {
                if (Math.abs(pointA - pointB) < 0.2) {
                    // Single click jump
                    mainVideo.currentTime = pointA;
                }
            }
            isDraggingAB = null;
        });

        // AB Points Control Buttons
        setPointABtn.addEventListener('click', () => {
            pointA = mainVideo.currentTime;
            updateABInputs();
            drawWaveform();
        });

        setPointBBtn.addEventListener('click', () => {
            pointB = mainVideo.currentTime;
            updateABInputs();
            drawWaveform();
        });

        toggleLoopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopStatusText.textContent = isLooping ? '开' : '关';
            loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
        });

        clearABBtn.addEventListener('click', () => {
            pointA = null;
            pointB = null;
            isLooping = false;
            loopStatusText.textContent = '关';
            loopStatusText.className = 'text-rose-400';
            updateABInputs();
            drawWaveform();
        });

        function updateABInputs() {
            inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
            inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
        }

        inputTimeA.addEventListener('change', () => { pointA = parseFloat(inputTimeA.value) || 0; drawWaveform(); });
        inputTimeB.addEventListener('change', () => { pointB = parseFloat(inputTimeB.value) || 0; drawWaveform(); });
        aMinusBtn.addEventListener('click', () => { if (pointA !== null) { pointA = Math.max(0, pointA - 0.1); updateABInputs(); drawWaveform(); } });
        aPlusBtn.addEventListener('click', () => { if (pointA !== null) { pointA += 0.1; updateABInputs(); drawWaveform(); } });
        bMinusBtn.addEventListener('click', () => { if (pointB !== null) { pointB = Math.max(0, pointB - 0.1); updateABInputs(); drawWaveform(); } });
        bPlusBtn.addEventListener('click', () => { if (pointB !== null) { pointB += 0.1; updateABInputs(); drawWaveform(); } });

        // --- 4. Global Shortcuts & Keyboard Navigation ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== noteTextarea && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlay();
            }
        });

        // --- 5. Speech-to-Text (STT) Feature ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const finalText = event.results[i][0].transcript;
                        appendTranscript(finalText);
                    }
                }
            };

            recognition.onerror = (err) => {
                console.warn('语音识别事件:', err.error);
            };

            recognition.onend = () => {
                if (isTranscribing) recognition.start();
            };
        }

        toggleSttBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('您的浏览器暂不支持 Web Speech 语音识别接口，请使用最新版 Chrome 或 Edge 浏览器。');
                return;
            }
            isTranscribing = !isTranscribing;
            if (isTranscribing) {
                recognition.start();
                sttStatusText.textContent = '识别中...';
                toggleSttBtn.className = 'px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded text-xs flex items-center space-x-1.5 transition';
            } else {
                recognition.stop();
                sttStatusText.textContent = '开启识别';
                toggleSttBtn.className = 'px-2.5 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded text-xs flex items-center space-x-1.5 transition';
            }
        });

        function appendTranscript(text) {
            const timeStr = formatTime(mainVideo.currentTime);
            const item = document.createElement('div');
            item.className = 'flex items-start space-x-1.5 hover:bg-slate-900 p-1 rounded group cursor-pointer';
            item.innerHTML = `
                <span class="text-sky-400 font-mono text-[11px] hover:underline">${timeStr}</span>
                <span class="text-slate-300 flex-1">${text}</span>
            `;
            item.querySelector('span').addEventListener('click', () => {
                const parts = timeStr.split(':');
                const seconds = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
                mainVideo.currentTime = seconds;
            });
            transcriptBox.appendChild(item);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        // --- 6. Notes Management & Export/Import ---
        insertTimestampBtn.addEventListener('click', () => {
            const timeStr = `[${formatTime(mainVideo.currentTime)}] `;
            const start = noteTextarea.selectionStart;
            const end = noteTextarea.selectionEnd;
            const text = noteTextarea.value;
            noteTextarea.value = text.substring(0, start) + timeStr + text.substring(end);
            noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
            noteTextarea.focus();
            saveLocalNote();
        });

        noteTextarea.addEventListener('input', () => {
            saveLocalNote();
            wordCountText.textContent = `${noteTextarea.value.length} 字`;
        });

        function saveLocalNote() {
            localStorage.setItem('studio_note_backup', noteTextarea.value);
            saveStateText.textContent = '已在本地实时暂存';
        }

        // Load Stored Note
        const savedNote = localStorage.getItem('studio_note_backup');
        if (savedNote) {
            noteTextarea.value = savedNote;
            wordCountText.textContent = `${savedNote.length} 字`;
        }

        // Save / Export Note File
        exportNoteBtn.addEventListener('click', () => {
            const content = noteTextarea.value;
            if (!content.trim()) {
                alert('笔记内容为空，无法保存。');
                return;
            }
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Video_Note_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Import Note File
        importNoteInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    noteTextarea.value = evt.target.result;
                    saveLocalNote();
                    wordCountText.textContent = `${noteTextarea.value.length} 字`;
                };
                reader.readAsText(file);
            }
        });

        // --- 7. Resizable Panels Logic ---
        let isResizingWaveform = false;
        waveformResizer.addEventListener('mousedown', () => { isResizingWaveform = true; });

        let isResizingPanel = false;
        panelResizer.addEventListener('mousedown', () => { isResizingPanel = true; });

        window.addEventListener('mousemove', (e) => {
            if (isResizingWaveform) {
                const containerRect = leftPanel.getBoundingClientRect();
                const newHeight = containerRect.bottom - e.clientY;
                if (newHeight > 100 && newHeight < containerRect.height - 150) {
                    waveformBox.style.height = `${newHeight}px`;
                    drawWaveform();
                }
            }

            if (isResizingPanel) {
                const containerWidth = document.getElementById('mainContainer').clientWidth;
                const newWidth = containerWidth - e.clientX;
                if (newWidth > 280 && newWidth < containerWidth - 350) {
                    rightPanel.style.width = `${newWidth}px`;
                    drawWaveform();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isResizingWaveform = false;
            isResizingPanel = false;
        });

        // Helper: Format Seconds to MM:SS.s
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00.0';
            const m = Math.floor(seconds / 60);
            const s = (seconds % 60).toFixed(1);
            const mStr = m < 10 ? '0' + m : m;
            const sStr = s < 10 ? '0' + s : s;
            return `${mStr}:${sStr}`;
        }

        // Initial Canvas Draw
        window.addEventListener('resize', drawWaveform);
        drawWaveform();
    </script>
</body>
</html>
