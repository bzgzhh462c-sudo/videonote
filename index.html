<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioVisualizer</title>
  <link rel="icon" type="image/png" href="favorate.png" sizes="32x32">
  <link rel="icon" type="image/png" href="favorate.png" sizes="16x16">
  <link rel="apple-touch-icon" href="favorate.png">
  <link rel="shortcut icon" href="favorate.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .waveform-container { user-select: none; touch-action: none; }
    .resizer-h { cursor: row-resize; height: 6px; background: #1e293b; }
    .resizer-h:hover { background: #0284c7; }
    .resizer-v { cursor: col-resize; width: 6px; background: #1e293b; }
    .resizer-v:hover { background: #0284c7; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-screen flex flex-col font-sans overflow-hidden select-none">
  <!-- Header -->
  <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="bg-sky-600 text-white p-1.5 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-volume-high text-lg"></i>
      </div>
      <h1 class="text-base font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
        AudioVisualizer Studio Pro
        <span class="text-xs px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">Precision Pro</span>
      </h1>
    </div>
    <div class="flex items-center space-x-3 text-xs">
      <label class="cursor-pointer bg-sky-600 hover:bg-sky-500 text-white font-medium px-3 py-1.5 rounded-md flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-folder-open"></i>
        <span>打开音频/视频文件</span>
        <input type="file" id="mediaFileInput" accept="video/*,audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg,.mp4,.webm,.mov" class="hidden">
      </label>
      <div class="h-4 w-px bg-slate-700"></div>
      <button id="saveNoteBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-md border border-emerald-600 flex items-center space-x-1.5 transition" title="直接覆盖保存到已绑定文件 (Cmd/Ctrl+S)">
        <i class="fa-solid fa-floppy-disk"></i>
        <span id="saveBtnText">保存笔记 (⌘S)</span>
      </button>
      <button id="saveAsNoteBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1 transition" title="另存为新文件">
        <i class="fa-solid fa-file-export text-sky-400"></i>
        <span>另存为...</span>
      </button>
      <button id="openNativeFileBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition" title="打开本地笔记文件并开启直接覆盖权限">
        <i class="fa-solid fa-file-import text-amber-400"></i>
        <span>打开/绑定本地文件</span>
      </button>
      <input type="file" id="fallbackNoteFileInput" accept=".txt,.md,.markdown,text/plain" class="hidden">
    </div>
  </header>
  <!-- Main Layout -->
  <div id="mainContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    <div id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-slate-900/50 overflow-hidden">
      <div id="mediaContainer" class="flex-1 bg-black flex items-center justify-center relative overflow-hidden group">
        <video id="mainVideo" class="max-h-full max-w-full object-contain hidden" playsinline></video>
        <div id="audioCoverBox" class="flex flex-col items-center justify-center space-y-3 text-slate-500 cursor-pointer w-full h-full">
          <div class="w-20 h-20 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center shadow-2xl">
            <i class="fa-solid fa-music text-3xl text-sky-400 animate-pulse"></i>
          </div>
          <span id="mediaFileName" class="text-sm font-medium text-slate-400">点击此处或上方按钮打开音视频文件</span>
        </div>
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-3">
          <button id="playPauseBtn" class="text-white hover:text-sky-400 text-xl w-8 h-8 flex items-center justify-center">
            <i class="fa-solid fa-play"></i>
          </button>
          <span id="currentTimeDisplay" class="text-xs font-mono text-slate-300">00:00.0 / 00:00.0</span>
          <input type="range" id="mediaProgressBar" value="0" step="0.001" min="0" max="100" class="flex-1 accent-sky-500 bg-slate-700 h-1.5 rounded cursor-pointer">
        </div>
      </div>
      <div id="waveformResizer" class="resizer-h flex items-center justify-center border-y border-slate-700/50 shrink-0">
        <div class="w-8 h-1 bg-slate-500 rounded-full"></div>
      </div>
      <div id="waveformBox" class="h-48 bg-slate-950 flex flex-col border-t border-slate-800 shrink-0 relative">
        <div class="h-9 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 text-xs shrink-0">
          <div class="flex items-center space-x-2">
            <span class="text-slate-400 font-medium"><i class="fa-solid fa-wave-square text-sky-400 mr-1"></i>高清波形:</span>
            <button id="zoomOutBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
              <i class="fa-solid fa-magnifying-glass-minus"></i> 缩小
            </button>
            <span id="zoomLevelDisplay" class="font-mono text-sky-400">1.0x</span>
            <button id="zoomInBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
              <i class="fa-solid fa-magnifying-glass-plus"></i> 放大
            </button>
            <div class="h-3 w-px bg-slate-700 mx-1"></div>
            <button id="toggleAutoScrollBtn" class="px-2.5 py-0.5 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-800 rounded flex items-center space-x-1 transition">
              <i class="fa-solid fa-arrows-to-eye"></i>
              <span>波形跟随: <b id="autoScrollStatusText" class="text-emerald-400">开</b></span>
            </button>
          </div>
          <div class="flex items-center space-x-2">
            <button id="toggleLoopBtn" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded flex items-center space-x-1">
              <i class="fa-solid fa-rotate-left"></i>
              <span>AB 循环: <b id="loopStatusText" class="text-rose-400">关</b></span>
            </button>
            <button id="clearABBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded flex items-center space-x-1">
              <i class="fa-solid fa-trash-can"></i>
              <span>清除 A-B</span>
            </button>
          </div>
        </div>
        <div id="waveformScrollContainer" class="flex-1 overflow-x-auto overflow-y-hidden relative waveform-container bg-slate-950">
          <canvas id="waveformCanvas" class="h-full block cursor-crosshair"></canvas>
        </div>
        <div class="h-8 bg-slate-900/80 border-t border-slate-800/80 flex items-center justify-between px-3 text-xs font-mono shrink-0">
          <div class="flex items-center space-x-2">
            <span class="text-emerald-400">A 点:</span>
            <input type="number" id="inputTimeA" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-emerald-400">
            <button id="aMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
            <button id="aPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
          </div>
          <div class="text-slate-500 text-[10px]">单击设A点(+3s为B) | 拖拽把手单独微调 | 按选区平移</div>
          <div class="flex items-center space-x-2">
            <span class="text-rose-400">B 点:</span>
            <input type="number" id="inputTimeB" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-rose-400">
            <button id="bMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
            <button id="bPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
          </div>
        </div>
      </div>
    </div>
    <div id="panelResizer" class="resizer-v hidden md:block border-x border-slate-700/50 shrink-0"></div>
    <div id="rightPanel" class="w-full md:w-[420px] flex flex-col bg-slate-900 shrink-0 border-l border-slate-800">
      <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-pen-to-square text-amber-400 text-sm"></i>
          <span class="text-xs font-bold text-slate-200">音视频笔记工作台</span>
        </div>
        <button id="insertTimestampBtn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs flex items-center space-x-1 transition">
          <i class="fa-regular fa-clock"></i>
          <span>插入当前时间戳</span>
        </button>
      </div>
      <div class="flex-1 p-3 bg-slate-900 flex flex-col">
        <textarea id="noteTextarea" class="w-full flex-1 bg-slate-950 text-slate-100 p-3 rounded-lg border border-slate-800 focus:border-sky-500 focus:outline-none font-sans text-sm resize-none leading-relaxed" placeholder="在此输入笔记内容... 点击右上方按钮可随时插入带有播放时间的快捷跳转链接 [MM:SS]"></textarea>
      </div>
      <div class="h-8 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-[11px] text-slate-500">
        <span id="saveStateText" class="text-amber-400/80">未绑定文件（点击“打开/绑定本地文件”后按 ⌘S 直接覆写）</span>
        <span id="wordCountText">0 字</span>
      </div>
    </div>
  </div>
  <script>
    // ========== DOM ==========
    const mediaFileInput = document.getElementById('mediaFileInput');
    const mainVideo = document.getElementById('mainVideo');
    const audioCoverBox = document.getElementById('audioCoverBox');
    const mediaFileName = document.getElementById('mediaFileName');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const mediaProgressBar = document.getElementById('mediaProgressBar');
    const waveformScrollContainer = document.getElementById('waveformScrollContainer');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const ctx = waveformCanvas.getContext('2d');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
    const toggleAutoScrollBtn = document.getElementById('toggleAutoScrollBtn');
    const autoScrollStatusText = document.getElementById('autoScrollStatusText');
    const toggleLoopBtn = document.getElementById('toggleLoopBtn');
    const loopStatusText = document.getElementById('loopStatusText');
    const clearABBtn = document.getElementById('clearABBtn');
    const inputTimeA = document.getElementById('inputTimeA');
    const inputTimeB = document.getElementById('inputTimeB');
    const aMinusBtn = document.getElementById('aMinusBtn');
    const aPlusBtn = document.getElementById('aPlusBtn');
    const bMinusBtn = document.getElementById('bMinusBtn');
    const bPlusBtn = document.getElementById('bPlusBtn');
    const noteTextarea = document.getElementById('noteTextarea');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const saveAsNoteBtn = document.getElementById('saveAsNoteBtn');
    const openNativeFileBtn = document.getElementById('openNativeFileBtn');
    const fallbackNoteFileInput = document.getElementById('fallbackNoteFileInput');
    const insertTimestampBtn = document.getElementById('insertTimestampBtn');
    const saveStateText = document.getElementById('saveStateText');
    const wordCountText = document.getElementById('wordCountText');
    const waveformResizer = document.getElementById('waveformResizer');
    const waveformBox = document.getElementById('waveformBox');
    const panelResizer = document.getElementById('panelResizer');
    const leftPanel = document.getElementById('leftPanel');
    const rightPanel = document.getElementById('rightPanel');

    // ========== State ==========
    let audioCtx = null;
    let videoMediaSourceNode = null;
    let videoGainNode = null;
    let audioBuffer = null;
    let sourceNode = null;
    let isPlaying = false;
    let startTime = 0;
    let pauseOffset = 0;
    let mediaDuration = 0;
    let zoomLevel = 1.0;
    let isAutoScrollEnabled = true;
    let pointA = null;
    let pointB = null;
    let isLooping = false;
    let rawChannelData = null;
    let isVideoMode = false;
    let mediaObjectURL = null;
    let isSeekingVideo = false;
    let isMouseDown = false;
    let dragMode = null;
    let dragStartX = 0;
    let dragStartA = 0;
    let dragOffsetTimeA = 0;
    let dragRangeDuration = 0;
    let dragPlayheadOffset = 0;
    let previewTime = null;
    let currentFileHandle = null;
    let loadedFileName = '';
    let waveformCache = null;
    let cacheWidth = 0;
    let cacheHeight = 0;
    let cacheZoom = 0;
    let renderPending = false;
    let progressRAF = null;
    let noteSaveTimer = null;

    // ========== 1. Load Media ==========
    async function loadMediaFile(file) {
      try {
        stopPlayback();
        if (mediaObjectURL) {
          URL.revokeObjectURL(mediaObjectURL);
          mediaObjectURL = null;
        }
        mainVideo.removeAttribute('src');
        mainVideo.load();
        isVideoMode = false;
        mainVideo.muted = false;
        mainVideo.volume = 1;
        mainVideo.pause();

        // 重置 GainNode，防止残留静音
        if (videoGainNode && audioCtx) {
          try {
            videoGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
            videoGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          } catch (e) {}
        }

        audioBuffer = null;
        rawChannelData = null;
        mediaDuration = 0;
        previewTime = null;
        isSeekingVideo = false;

        const isVideo = file.type.startsWith('video/') ||
          /\.(mp4|webm|mov|mkv|m4v|avi)$/i.test(file.name);

        const arrayBuffer = await file.arrayBuffer();
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
          mediaDuration = audioBuffer.duration;
          rawChannelData = audioBuffer.getChannelData(0);
        } catch (decodeErr) {
          console.warn('音频解码失败:', decodeErr);
          if (!isVideo) throw decodeErr;
        }

        mediaFileName.textContent = file.name;

        if (isVideo) {
          isVideoMode = true;
          mediaObjectURL = URL.createObjectURL(file);
          mainVideo.src = mediaObjectURL;
          mainVideo.classList.remove('hidden');
          audioCoverBox.classList.add('hidden');
          await new Promise((resolve) => {
            const onMeta = () => {
              mainVideo.removeEventListener('loadedmetadata', onMeta);
              if (!mediaDuration || mediaDuration < 0.1) {
                mediaDuration = mainVideo.duration || 0;
              }
              resolve();
            };
            if (mainVideo.readyState >= 1) onMeta();
            else mainVideo.addEventListener('loadedmetadata', onMeta);
          });
        } else {
          isVideoMode = false;
          mainVideo.classList.add('hidden');
          audioCoverBox.classList.remove('hidden');
          audioCoverBox.classList.add('flex');
        }

        invalidateWaveformCache();
        requestDrawWaveform();
        updateProgress();
      } catch (err) {
        console.error('媒体加载失败:', err);
        alert('无法解析该文件，请尝试其他 mp3 / wav / mp4 / webm 格式。');
      }
    }

    mediaFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadMediaFile(file);
    });

    // ========== 2. Playback ==========
    function getCurrentTime() {
      if (previewTime !== null) return previewTime;
      if (isVideoMode) {
        let cur = mainVideo.currentTime || 0;
        if (isLooping && pointA !== null && pointB !== null && pointA < pointB && !isMouseDown) {
          if (cur >= pointB) {
            const len = pointB - pointA;
            cur = pointA + ((cur - pointA) % len);
          }
        }
        return Math.min(mediaDuration || mainVideo.duration || 0, Math.max(0, cur));
      }
      if (!isPlaying) return pauseOffset;
      let cur = audioCtx.currentTime - startTime;
      if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
        if (cur >= pointB) {
          const len = pointB - pointA;
          cur = pointA + ((cur - pointA) % len);
        }
      }
      return Math.min(mediaDuration, Math.max(0, cur));
    }

    function ensureVideoAudioGraph() {
      if (!isVideoMode || !mainVideo.src) return false;
      if (videoGainNode) return true;

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        videoMediaSourceNode = audioCtx.createMediaElementSource(mainVideo);
        videoGainNode = audioCtx.createGain();
        videoGainNode.gain.value = 1;
        videoMediaSourceNode.connect(videoGainNode);
        videoGainNode.connect(audioCtx.destination);

        // Safari：接管后由 GainNode 控制，元素自身静音
        mainVideo.muted = true;
        mainVideo.volume = 1;
        return true;
      } catch (err) {
        console.warn('无法启用 Web Audio 视频路由，将回退到元素播放:', err);
        videoMediaSourceNode = null;
        videoGainNode = null;
        return false;
      }
    }

    function safeVideoSeek(time, onDone) {
      if (!isVideoMode || !mainVideo.src || isSeekingVideo) return;

      const hasGain = ensureVideoAudioGraph();
      isSeekingVideo = true;

      const wasPlaying = !mainVideo.paused && isPlaying;
      const shouldResume = wasPlaying || typeof onDone === 'function';
      const duration = Number.isFinite(mainVideo.duration) ? mainVideo.duration : mediaDuration;
      const target = Math.max(0, Math.min(duration || 0, Number(time) || 0));

      let finished = false;
      let seekTimeout = null;

      const gainParam = hasGain ? videoGainNode.gain : null;

      const fadeTo = (value, seconds) => {
        if (!hasGain || !audioCtx) return;
        const now = audioCtx.currentTime;
        gainParam.cancelScheduledValues(now);
        gainParam.setValueAtTime(gainParam.value, now);
        gainParam.linearRampToValueAtTime(value, now + seconds);
      };

      const restoreGain = () => {
        if (hasGain && audioCtx) {
          const now = audioCtx.currentTime;
          gainParam.cancelScheduledValues(now);
          gainParam.setValueAtTime(0, now);
          gainParam.linearRampToValueAtTime(1, now + 0.06);
        }
        isSeekingVideo = false;
      };

      const finish = () => {
        if (finished) return;
        finished = true;
        if (seekTimeout !== null) clearTimeout(seekTimeout);
        mainVideo.removeEventListener('seeked', onSeeked);

        setTimeout(async () => {
          updateProgress();
          requestDrawWaveform();

          if (!shouldResume) {
            restoreGain();
            return;
          }

          try {
            if (audioCtx && audioCtx.state !== 'running') {
              await audioCtx.resume();
            }

            let playResult;
            if (typeof onDone === 'function') {
              playResult = onDone();
            } else {
              playResult = mainVideo.play();
            }
            await Promise.resolve(playResult);

            if (hasGain) {
              const now = audioCtx.currentTime;
              gainParam.cancelScheduledValues(now);
              gainParam.setValueAtTime(0, now);
              gainParam.linearRampToValueAtTime(1, now + 0.08);
              setTimeout(() => { isSeekingVideo = false; }, 100);
            } else {
              isSeekingVideo = false;
            }
          } catch (err) {
            console.warn('seek 后恢复播放失败:', err);
            restoreGain();
          }
        }, 40);
      };

      const onSeeked = () => {
        requestAnimationFrame(() => requestAnimationFrame(finish));
      };

      if (Math.abs(mainVideo.currentTime - target) < 0.025) {
        isSeekingVideo = false;
        if (typeof onDone === 'function') {
          Promise.resolve(onDone()).catch(err => console.warn('播放失败:', err));
        }
        return;
      }

      if (hasGain) fadeTo(0, 0.015);

      mainVideo.addEventListener('seeked', onSeeked, { once: true });

      setTimeout(() => {
        mainVideo.pause();
        mainVideo.currentTime = target;
        seekTimeout = setTimeout(finish, 1200);
      }, hasGain ? 20 : 0);
    }

    function playMedia(offset = 0) {
      previewTime = null;

      // ========== 视频模式 ==========
      if (isVideoMode) {
        if (!mainVideo.src) return;

        if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
          if (offset < pointA || offset >= pointB) offset = pointA;
        }

        ensureVideoAudioGraph();

        safeVideoSeek(offset, async () => {
          if (audioCtx && audioCtx.state !== 'running') {
            await audioCtx.resume();
          }
          return mainVideo.play().catch(e => {
            console.warn('video play', e);
            throw e;
          });
        });

        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        startProgressLoop();
        return;
      }

      // ========== 纯音频模式 ==========
      if (!audioBuffer) {
        console.warn('audioBuffer 为空，无法播放');
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const doStart = () => {
        try {
          stopAudioSource();

          sourceNode = audioCtx.createBufferSource();
          sourceNode.buffer = audioBuffer;

          if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
            if (offset < pointA || offset >= pointB) offset = pointA;
            sourceNode.loop = true;
            sourceNode.loopStart = pointA;
            sourceNode.loopEnd = pointB;
          } else {
            sourceNode.loop = false;
          }

          sourceNode.connect(audioCtx.destination);
          sourceNode.start(0, Math.max(0, offset));

          startTime = audioCtx.currentTime - offset;
          isPlaying = true;
          playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

          sourceNode.onended = () => {
            if (!isLooping && isPlaying) {
              stopPlayback();
              pauseOffset = 0;
            }
          };

          startProgressLoop();
        } catch (err) {
          console.error('纯音频启动失败:', err);
        }
      };

      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
        audioCtx.resume()
          .then(() => {
            if (audioCtx.state === 'running') doStart();
            else setTimeout(() => audioCtx.resume().then(doStart).catch(doStart), 60);
          })
          .catch(() => doStart());
      } else {
        doStart();
      }
    }

    function stopAudioSource() {
      if (sourceNode) {
        try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
        sourceNode = null;
      }
    }

    function stopPlayback() {
      if (isVideoMode) {
        mainVideo.pause();
      } else {
        stopAudioSource();
      }
      isPlaying = false;
      playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      stopProgressLoop();
    }

    function seekMedia(targetTime) {
      const t = Math.max(0, Math.min(mediaDuration || 99999, targetTime));
      pauseOffset = t;
      previewTime = null;
      if (isVideoMode) {
        safeVideoSeek(t);
      } else {
        if (isPlaying) {
          playMedia(t);
        } else {
          updateProgress();
          requestDrawWaveform();
        }
      }
    }

    function togglePlay() {
      // 任何播放操作都尝试唤醒 AudioContext（Safari 关键）
      if (audioCtx && audioCtx.state !== 'running') {
        audioCtx.resume().catch(() => {});
      }

      if (isVideoMode) {
        if (!mainVideo.src) return;
        if (isPlaying || !mainVideo.paused) {
          pauseOffset = mainVideo.currentTime;
          stopPlayback();
        } else {
          playMedia(pauseOffset || mainVideo.currentTime);
        }
        return;
      }
      if (!audioBuffer) return;
      if (isPlaying) {
        pauseOffset = getCurrentTime();
        stopPlayback();
      } else {
        playMedia(pauseOffset);
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    audioCoverBox.addEventListener('click', togglePlay);
    mainVideo.addEventListener('click', togglePlay);

    mainVideo.addEventListener('timeupdate', () => {
      if (!isVideoMode || !isPlaying || isMouseDown || isSeekingVideo) return;
      if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
        if (mainVideo.currentTime >= pointB - 0.04) {
          safeVideoSeek(pointA);
        }
      }
    });

    mainVideo.addEventListener('ended', () => {
      if (!isLooping) {
        stopPlayback();
        pauseOffset = 0;
      }
    });

    mainVideo.addEventListener('play', () => {
      isPlaying = true;
      playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      startProgressLoop();
    });

    mainVideo.addEventListener('pause', () => {
      if (isVideoMode) {
        isPlaying = false;
        playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        pauseOffset = mainVideo.currentTime;
        stopProgressLoop();
      }
    });

    function startProgressLoop() {
      stopProgressLoop();
      function loop() {
        if (!isPlaying) return;
        updateProgress();
        requestDrawWaveform();
        progressRAF = requestAnimationFrame(loop);
      }
      progressRAF = requestAnimationFrame(loop);
    }

    function stopProgressLoop() {
      if (progressRAF) {
        cancelAnimationFrame(progressRAF);
        progressRAF = null;
      }
    }

    function updateProgress() {
      const cur = getCurrentTime();
      const dur = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      mediaProgressBar.value = dur ? (cur / dur) * 100 : 0;
    }

    mediaProgressBar.addEventListener('input', (e) => {
      const dur = mediaDuration || (isVideoMode ? mainVideo.duration : 0);
      if (dur) seekMedia((e.target.value / 100) * dur);
    });

    // ========== 3. Waveform ==========
    function invalidateWaveformCache() {
      waveformCache = null;
      cacheWidth = 0;
      cacheHeight = 0;
      cacheZoom = 0;
    }

    function buildWaveformCache(canvasWidth, canvasHeight) {
      if (canvasWidth < 1 || canvasHeight < 1) return;

      const dpr = window.devicePixelRatio || 1;
      const off = document.createElement('canvas');
      try {
        off.width = canvasWidth * dpr;
        off.height = canvasHeight * dpr;
      } catch (e) {
        console.warn('波形 canvas 创建失败', e);
        return;
      }

      const octx = off.getContext('2d');
      octx.scale(dpr, dpr);
      octx.fillStyle = '#020617';
      octx.fillRect(0, 0, canvasWidth, canvasHeight);

      if (!rawChannelData) {
        octx.fillStyle = '#475569';
        octx.font = '13px sans-serif';
        octx.textAlign = 'center';
        octx.fillText(isVideoMode ? '视频已加载（无可用音轨或解码中）' : '请打开音频/视频文件，此处显示高精度波形', canvasWidth / 2, canvasHeight / 2);
        waveformCache = off;
        cacheWidth = canvasWidth;
        cacheHeight = canvasHeight;
        cacheZoom = zoomLevel;
        return;
      }

      const midY = canvasHeight / 2;
      const maxBarHeight = midY * 0.88;
      const totalSamples = rawChannelData.length;
      const step = Math.max(1, Math.ceil(totalSamples / canvasWidth));

      octx.fillStyle = '#38bdf8';
      for (let i = 0; i < canvasWidth; i++) {
        let min = 1.0, max = -1.0;
        const start = i * step;
        const end = Math.min(start + step, totalSamples);
        for (let j = start; j < end; j++) {
          const val = rawChannelData[j];
          if (val < min) min = val;
          if (val > max) max = val;
        }
        const amp = Math.max(Math.abs(min), Math.abs(max));
        const h = amp * maxBarHeight;
        octx.fillRect(i, midY - h, 1, Math.max(1, h * 2));
      }

      octx.strokeStyle = '#1e293b';
      octx.beginPath();
      octx.moveTo(0, midY);
      octx.lineTo(canvasWidth, midY);
      octx.stroke();

      waveformCache = off;
      cacheWidth = canvasWidth;
      cacheHeight = canvasHeight;
      cacheZoom = zoomLevel;
    }

    function requestDrawWaveform() {
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(() => {
        drawWaveform();
        renderPending = false;
      });
    }

    function drawWaveform() {
      const containerWidth = waveformScrollContainer.clientWidth;
      // 限制最大宽度，防止 Firefox 超大 canvas 绘制失败变成一片蓝
      const MAX_WAVEFORM_WIDTH = 8192;
      const desiredWidth = Math.max(containerWidth, Math.floor(containerWidth * zoomLevel));
      const canvasWidth = Math.min(desiredWidth, MAX_WAVEFORM_WIDTH);
      const canvasHeight = waveformScrollContainer.clientHeight || 120;
      const dpr = window.devicePixelRatio || 1;

      if (waveformCanvas.width !== canvasWidth * dpr || waveformCanvas.height !== canvasHeight * dpr) {
        waveformCanvas.width = canvasWidth * dpr;
        waveformCanvas.height = canvasHeight * dpr;
        waveformCanvas.style.width = canvasWidth + 'px';
        waveformCanvas.style.height = canvasHeight + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!waveformCache || cacheWidth !== canvasWidth || cacheHeight !== canvasHeight || cacheZoom !== zoomLevel) {
        buildWaveformCache(canvasWidth, canvasHeight);
      }
      if (waveformCache) {
        ctx.drawImage(waveformCache, 0, 0, canvasWidth, canvasHeight);
      }

      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (duration > 0) {
        if (pointA !== null && pointB !== null) {
          const xA = (pointA / duration) * canvasWidth;
          const xB = (pointB / duration) * canvasWidth;
          const startX = Math.min(xA, xB);
          const endX = Math.max(xA, xB);
          ctx.fillStyle = 'rgba(14, 165, 233, 0.25)';
          ctx.fillRect(startX, 0, endX - startX, canvasHeight);
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(startX, 0, endX - startX, 2);
          ctx.fillRect(startX, canvasHeight - 2, endX - startX, 2);
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(xA, 0);
          ctx.lineTo(xA, canvasHeight);
          ctx.stroke();
          ctx.fillStyle = '#10b981';
          ctx.fillRect(xA - 7, 0, 14, 18);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('A', xA, 13);
          ctx.strokeStyle = '#f43f5e';
          ctx.beginPath();
          ctx.moveTo(xB, 0);
          ctx.lineTo(xB, canvasHeight);
          ctx.stroke();
          ctx.fillStyle = '#f43f5e';
          ctx.fillRect(xB - 7, 0, 14, 18);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('B', xB, 13);
        }
        const playX = (getCurrentTime() / duration) * canvasWidth;
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(playX, 0);
        ctx.lineTo(playX, canvasHeight);
        ctx.stroke();
        if (isAutoScrollEnabled && zoomLevel > 1.0 && isPlaying && previewTime === null) {
          const viewW = waveformScrollContainer.clientWidth;
          const target = playX - viewW / 2;
          const current = waveformScrollContainer.scrollLeft;
          if (Math.abs(current - target) > 2) {
            waveformScrollContainer.scrollLeft = target;
          }
        }
      }
    }

    // ========== 4. Zoom & Drag ==========
    zoomInBtn.addEventListener('click', () => {
      zoomLevel = Math.min(20.0, zoomLevel + 1.0);
      zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
      invalidateWaveformCache();
      requestDrawWaveform();
    });
    zoomOutBtn.addEventListener('click', () => {
      zoomLevel = Math.max(1.0, zoomLevel - 1.0);
      zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
      invalidateWaveformCache();
      requestDrawWaveform();
    });
    toggleAutoScrollBtn.addEventListener('click', () => {
      isAutoScrollEnabled = !isAutoScrollEnabled;
      autoScrollStatusText.textContent = isAutoScrollEnabled ? '开' : '关';
      autoScrollStatusText.className = isAutoScrollEnabled ? 'text-emerald-400' : 'text-rose-400';
    });

    function getCanvasTimeFromEvent(e) {
      const rect = waveformCanvas.getBoundingClientRect();
      const cssWidth = waveformCanvas.clientWidth;
      const clickX = e.clientX - rect.left;
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration || cssWidth === 0) return 0;
      return Math.max(0, Math.min(duration, (clickX / cssWidth) * duration));
    }

    waveformCanvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      dragStartX = e.clientX;
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration) return;
      const clickTime = getCanvasTimeFromEvent(e);
      const cssWidth = waveformCanvas.clientWidth;
      const clickX = e.clientX - waveformCanvas.getBoundingClientRect().left;
      const curPlay = getCurrentTime();
      if (pointA !== null && pointB !== null) {
        const xA = (pointA / duration) * cssWidth;
        const xB = (pointB / duration) * cssWidth;
        if (Math.abs(clickX - xA) <= 12) {
          dragMode = 'A';
          previewTime = pointA;
          return;
        }
        if (Math.abs(clickX - xB) <= 12) {
          dragMode = 'B';
          previewTime = pointB;
          return;
        }
        if (clickX > Math.min(xA, xB) && clickX < Math.max(xA, xB)) {
          dragMode = 'RANGE';
          dragOffsetTimeA = clickTime - pointA;
          dragRangeDuration = pointB - pointA;
          dragPlayheadOffset = Math.max(0, Math.min(dragRangeDuration, curPlay - pointA));
          previewTime = pointA + dragPlayheadOffset;
          waveformCanvas.style.cursor = 'grabbing';
          return;
        }
      }
      dragMode = 'SELECT';
      dragStartA = clickTime;
      previewTime = clickTime;
    });

    window.addEventListener('mousemove', (e) => {
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (!duration) return;
      const currentTime = getCanvasTimeFromEvent(e);
      const cssWidth = waveformCanvas.clientWidth;
      const currentX = e.clientX - waveformCanvas.getBoundingClientRect().left;
      if (!isMouseDown && pointA !== null && pointB !== null) {
        const xA = (pointA / duration) * cssWidth;
        const xB = (pointB / duration) * cssWidth;
        if (Math.abs(currentX - xA) <= 12 || Math.abs(currentX - xB) <= 12) {
          waveformCanvas.style.cursor = 'col-resize';
        } else if (currentX > Math.min(xA, xB) && currentX < Math.max(xA, xB)) {
          waveformCanvas.style.cursor = 'grab';
        } else {
          waveformCanvas.style.cursor = 'crosshair';
        }
      }
      if (!isMouseDown || !dragMode) return;
      if (dragMode === 'A') {
        pointA = Math.min(currentTime, pointB - 0.1);
        previewTime = pointA;
      } else if (dragMode === 'B') {
        pointB = Math.max(currentTime, pointA + 0.1);
        previewTime = pointB;
      } else if (dragMode === 'RANGE') {
        let newA = currentTime - dragOffsetTimeA;
        if (newA < 0) newA = 0;
        if (newA + dragRangeDuration > duration) newA = duration - dragRangeDuration;
        pointA = newA;
        pointB = newA + dragRangeDuration;
        previewTime = pointA + dragPlayheadOffset;
      } else if (dragMode === 'SELECT') {
        pointA = Math.min(dragStartA, currentTime);
        pointB = Math.max(dragStartA, currentTime);
        previewTime = pointA;
      }
      enforceABConstraint();
      updateABInputs();
      requestDrawWaveform();
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      const moveDist = Math.abs(e.clientX - dragStartX);
      const duration = mediaDuration || (isVideoMode ? mainVideo.duration : 0) || 0;
      if (dragMode === 'SELECT' && moveDist < 5) {
        if (duration > 0) {
          const clickTime = getCanvasTimeFromEvent(e);
          pointA = clickTime;
          pointB = Math.min(duration, clickTime + 3.0);
          previewTime = clickTime;
        }
      }
      if (previewTime !== null) {
        seekMedia(previewTime);
      }
      previewTime = null;
      if (dragMode === 'RANGE') waveformCanvas.style.cursor = 'grab';
      isMouseDown = false;
      dragMode = null;
      enforceABConstraint();
      updateABInputs();
      if (isLooping && isPlaying && !isVideoMode) {
        playMedia(getCurrentTime());
      }
      requestDrawWaveform();
    });

    function enforceABConstraint() {
      if (pointA !== null && pointB !== null) {
        if (pointB < pointA) {
          const t = pointA; pointA = pointB; pointB = t;
        }
        if (pointB - pointA < 0.1) pointB = pointA + 0.1;
      }
    }

    toggleLoopBtn.addEventListener('click', () => {
      isLooping = !isLooping;
      loopStatusText.textContent = isLooping ? '开' : '关';
      loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
    });

    clearABBtn.addEventListener('click', () => {
      pointA = null;
      pointB = null;
      isLooping = false;
      loopStatusText.textContent = '关';
      loopStatusText.className = 'text-rose-400';
      previewTime = null;
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });

    function updateABInputs() {
      inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
      inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
    }

    inputTimeA.addEventListener('change', () => {
      pointA = parseFloat(inputTimeA.value) || 0;
      enforceABConstraint();
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });
    inputTimeB.addEventListener('change', () => {
      pointB = parseFloat(inputTimeB.value) || 0;
      enforceABConstraint();
      updateABInputs();
      if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
      requestDrawWaveform();
    });
    aMinusBtn.addEventListener('click', () => {
      if (pointA !== null) {
        pointA = Math.max(0, pointA - 0.1);
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    aPlusBtn.addEventListener('click', () => {
      if (pointA !== null) {
        pointA += 0.1;
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    bMinusBtn.addEventListener('click', () => {
      if (pointB !== null) {
        pointB = Math.max(pointA + 0.1, pointB - 0.1);
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });
    bPlusBtn.addEventListener('click', () => {
      if (pointB !== null) {
        pointB += 0.1;
        enforceABConstraint();
        updateABInputs();
        if (isPlaying && !isVideoMode) playMedia(getCurrentTime());
        requestDrawWaveform();
      }
    });

    // ========== 5. 笔记保存 ==========
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== noteTextarea && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveNoteDirectly();
      }
    });

    function setSaveStatus(message, kind = 'info') {
      saveStateText.textContent = message;
      saveStateText.className = kind === 'success'
        ? 'text-emerald-400 font-semibold'
        : kind === 'error'
          ? 'text-rose-400 font-semibold'
          : 'text-amber-400 font-semibold';
    }

    function supportsFilePicker(apiName) {
      return window.isSecureContext === true && typeof window[apiName] === 'function';
    }

    openNativeFileBtn.addEventListener('click', async () => {
      if (supportsFilePicker('showOpenFilePicker')) {
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
              description: 'Markdown / Text',
              accept: { 'text/plain': ['.md', '.txt', '.markdown'] }
            }]
          });
          if (!handle) return;

          const file = await handle.getFile();
          const text = await file.text();
          currentFileHandle = handle;
          loadedFileName = file.name;
          noteTextarea.value = text;
          wordCountText.textContent = `${text.length} 字`;
          setSaveStatus(`已绑定原文件: ${handle.name}（${new Date().toLocaleTimeString()}）`, 'success');
          saveBtnText.textContent = '覆写保存 (⌘S)';
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.warn('打开文件选择器失败，改用普通文件选择：', err);
          setSaveStatus('无法打开系统文件选择器，请在弹出的窗口中选择笔记文件。');
          fallbackNoteFileInput.click();
        }
      } else {
        fallbackNoteFileInput.click();
      }
    });

    fallbackNoteFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const text = String(evt.target.result ?? '');
        noteTextarea.value = text;
        loadedFileName = file.name;
        wordCountText.textContent = `${text.length} 字`;
        currentFileHandle = null;
        setSaveStatus(`已载入: ${file.name}。此浏览器未提供直接覆写权限；保存时将导出文件。`);
        saveBtnText.textContent = '保存笔记 (⌘S)';
      };
      reader.onerror = () => setSaveStatus('读取文件失败，请重新选择文件。', 'error');
      reader.readAsText(file);
      e.target.value = '';
    });

    async function writeToHandle(handle, content) {
      const writable = await handle.createWritable();
      try {
        await writable.write(content);
      } catch (err) {
        try { await writable.abort(); } catch (_) {}
        throw err;
      }
      await writable.close();
    }

    async function saveNoteDirectly(forceSaveAs = false) {
      const content = noteTextarea.value;
      const timeNow = new Date().toLocaleTimeString();

      if (!forceSaveAs && currentFileHandle) {
        try {
          await writeToHandle(currentFileHandle, content);
          setSaveStatus(`已于 ${timeNow} 保存至: ${currentFileHandle.name}`, 'success');
          return;
        } catch (err) {
          console.warn('覆写保存失败：', err);
          setSaveStatus('无法覆写原文件，将尝试另存为。');
        }
      }

      if (supportsFilePicker('showSaveFilePicker')) {
        try {
          const suggestedName = loadedFileName || `Note_${new Date().toISOString().slice(0, 10)}.md`;
          const handle = await window.showSaveFilePicker({
            suggestedName,
            types: [{
              description: 'Markdown / Text',
              accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] }
            }]
          });
          if (!handle) return;
          await writeToHandle(handle, content);
          currentFileHandle = handle;
          loadedFileName = handle.name;
          setSaveStatus(`已绑定并于 ${timeNow} 保存至: ${handle.name}`, 'success');
          saveBtnText.textContent = '覆写保存 (⌘S)';
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.warn('系统保存选择器失败，改用下载导出：', err);
          exportDownloadFallback(content, forceSaveAs);
          setSaveStatus('系统保存窗口不可用，已改用下载方式导出笔记。', 'success');
          return;
        }
      }

      exportDownloadFallback(content, forceSaveAs);
    }

    function exportDownloadFallback(content, forceSaveAs = false) {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const defaultName = `Note_${new Date().toISOString().slice(0, 10)}.md`;
      let downloadName = loadedFileName || defaultName;
      if (forceSaveAs) {
        if (loadedFileName) {
          const dot = loadedFileName.lastIndexOf('.');
          const stem = dot > 0 ? loadedFileName.slice(0, dot) : loadedFileName;
          const ext = dot > 0 ? loadedFileName.slice(dot) : '.md';
          downloadName = `${stem}_copy${ext}`;
        } else {
          downloadName = defaultName;
        }
      }
      a.download = downloadName;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setSaveStatus(`已于 ${new Date().toLocaleTimeString()} 导出下载文件。`, 'success');
    }

    saveNoteBtn.addEventListener('click', () => saveNoteDirectly(false));
    saveAsNoteBtn.addEventListener('click', () => saveNoteDirectly(true));

    insertTimestampBtn.addEventListener('click', () => {
      const timeStr = `[${formatTime(getCurrentTime())}] `;
      const start = noteTextarea.selectionStart;
      const text = noteTextarea.value;
      noteTextarea.value = text.substring(0, start) + timeStr + text.substring(noteTextarea.selectionEnd);
      noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
      noteTextarea.focus();
      wordCountText.textContent = `${noteTextarea.value.length} 字`;
    });

    noteTextarea.addEventListener('input', () => {
      wordCountText.textContent = `${noteTextarea.value.length} 字`;
      if (noteSaveTimer) clearTimeout(noteSaveTimer);
      noteSaveTimer = setTimeout(() => {
        try {
          localStorage.setItem('local_note_backup', noteTextarea.value);
        } catch (e) {}
      }, 300);
    });

    try {
      const savedNote = localStorage.getItem('local_note_backup');
      if (savedNote) {
        noteTextarea.value = savedNote;
        wordCountText.textContent = `${savedNote.length} 字`;
      }
    } catch (e) {}

    // ========== 6. Resizers ==========
    let isResizingH = false;
    waveformResizer.addEventListener('mousedown', (e) => { isResizingH = true; e.preventDefault(); });
    let isResizingV = false;
    panelResizer.addEventListener('mousedown', (e) => { isResizingV = true; e.preventDefault(); });

    window.addEventListener('mousemove', (e) => {
      if (isResizingH) {
        const containerRect = leftPanel.getBoundingClientRect();
        const newHeight = containerRect.bottom - e.clientY;
        if (newHeight > 100 && newHeight < containerRect.height - 120) {
          waveformBox.style.height = `${newHeight}px`;
          invalidateWaveformCache();
          requestDrawWaveform();
        }
      }
      if (isResizingV) {
        const containerWidth = document.getElementById('mainContainer').clientWidth;
        const newWidth = containerWidth - e.clientX;
        if (newWidth > 280 && newWidth < containerWidth - 300) {
          rightPanel.style.width = `${newWidth}px`;
        }
      }
    });

    window.addEventListener('mouseup', () => { isResizingH = false; isResizingV = false; });

    function formatTime(sec) {
      if (isNaN(sec) || sec == null) return '00:00.0';
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
    }

    window.addEventListener('resize', () => {
      invalidateWaveformCache();
      requestDrawWaveform();
    });

    requestDrawWaveform();
  </script>
</body>
</html>
