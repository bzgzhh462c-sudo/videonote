<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioVisualizer Studio Pro - 极速精准版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#0284c7', 600: '#0284c7', 700: '#0369a1' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .waveform-container { user-select: none; touch-action: none; }
        .resizer-h { cursor: row-resize; height: 6px; background: #1e293b; }
        .resizer-h:hover { background: #0284c7; }
        .resizer-v { cursor: col-resize; width: 6px; background: #1e293b; }
        .resizer-v:hover { background: #0284c7; }
        /* 让 textarea 打字更顺滑 */
        #noteTextarea { contain: content; will-change: contents; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-screen flex flex-col font-sans overflow-hidden select-none">

    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </div>
            <h1 class="text-base font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                AudioVisualizer Studio Pro <span class="text-xs px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">Precision Pro</span>
            </h1>
        </div>

        <div class="flex items-center space-x-3 text-xs">
            <label class="cursor-pointer bg-sky-600 hover:bg-sky-500 text-white font-medium px-3 py-1.5 rounded-md flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-folder-open"></i>
                <span>打开音频/视频文件</span>
                <input type="file" id="mediaFileInput" accept="video/*,audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" class="hidden">
            </label>
            <div class="h-4 w-px bg-slate-700"></div>
            <button id="saveNoteBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-md border border-emerald-600 flex items-center space-x-1.5 transition" title="直接覆盖保存到已绑定文件 (Cmd/Ctrl+S)">
                <i class="fa-solid fa-floppy-disk"></i>
                <span id="saveBtnText">保存笔记 (⌘S)</span>
            </button>
            <button id="saveAsNoteBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1 transition" title="另存为新文件">
                <i class="fa-solid fa-file-export text-sky-400"></i>
                <span>另存为...</span>
            </button>
            <button id="openNativeFileBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition" title="打开本地笔记文件 (.txt / .md)">
                <i class="fa-solid fa-file-import text-amber-400"></i>
                <span>打开/绑定本地文件</span>
            </button>
            <input type="file" id="fallbackNoteFileInput" accept=".txt,.md,.markdown,text/plain" class="hidden">
        </div>
    </header>

    <div id="mainContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <div id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-slate-900/50 overflow-hidden">
            <div id="mediaContainer" class="flex-1 bg-black flex items-center justify-center relative overflow-hidden group">
                <video id="mainVideo" class="max-h-full max-w-full object-contain hidden"></video>
                <div id="audioCoverBox" class="flex flex-col items-center justify-center space-y-3 text-slate-500 cursor-pointer w-full h-full">
                    <div class="w-20 h-20 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center shadow-2xl">
                        <i class="fa-solid fa-music text-3xl text-sky-400 animate-pulse"></i>
                    </div>
                    <span id="mediaFileName" class="text-sm font-medium text-slate-400">点击此处或上方按钮打开音视频文件</span>
                </div>
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-3">
                    <button id="playPauseBtn" class="text-white hover:text-sky-400 text-xl w-8 h-8 flex items-center justify-center">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <span id="currentTimeDisplay" class="text-xs font-mono text-slate-300">00:00.0 / 00:00.0</span>
                    <input type="range" id="mediaProgressBar" value="0" step="0.001" min="0" max="100" class="flex-1 accent-sky-500 bg-slate-700 h-1.5 rounded cursor-pointer">
                </div>
            </div>

            <div id="waveformResizer" class="resizer-h flex items-center justify-center border-y border-slate-700/50 shrink-0">
                <div class="w-8 h-1 bg-slate-500 rounded-full"></div>
            </div>

            <div id="waveformBox" class="h-48 bg-slate-950 flex flex-col border-t border-slate-800 shrink-0 relative">
                <div class="h-9 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 text-xs shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-wave-square text-sky-400 mr-1"></i>高清波形:</span>
                        <button id="zoomOutBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-minus"></i> 缩小
                        </button>
                        <span id="zoomLevelDisplay" class="font-mono text-sky-400">1.0x</span>
                        <button id="zoomInBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> 放大
                        </button>
                        <div class="h-3 w-px bg-slate-700 mx-1"></div>
                        <button id="toggleAutoScrollBtn" class="px-2.5 py-0.5 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-800 rounded flex items-center space-x-1 transition">
                            <i class="fa-solid fa-arrows-to-eye"></i>
                            <span>波形跟随: <b id="autoScrollStatusText" class="text-emerald-400">开</b></span>
                        </button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="toggleLoopBtn" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>AB 循环: <b id="loopStatusText" class="text-rose-400">关</b></span>
                        </button>
                        <button id="clearABBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清除 A-B</span>
                        </button>
                    </div>
                </div>

                <div id="waveformScrollContainer" class="flex-1 overflow-x-auto overflow-y-hidden relative waveform-container bg-slate-950">
                    <canvas id="waveformCanvas" class="h-full block cursor-crosshair"></canvas>
                </div>

                <div class="h-8 bg-slate-900/80 border-t border-slate-800/80 flex items-center justify-between px-3 text-xs font-mono shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="text-emerald-400">A 点:</span>
                        <input type="number" id="inputTimeA" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-emerald-400">
                        <button id="aMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="aPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                    <div class="text-slate-500 text-[10px]">单击设A点(+3s为B) | 拖拽把手单独微调 | 按选区平移</div>
                    <div class="flex items-center space-x-2">
                        <span class="text-rose-400">B 点:</span>
                        <input type="number" id="inputTimeB" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-rose-400">
                        <button id="bMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="bPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="panelResizer" class="resizer-v hidden md:block border-x border-slate-700/50 shrink-0"></div>

        <div id="rightPanel" class="w-full md:w-[420px] flex flex-col bg-slate-900 shrink-0 border-l border-slate-800">
            <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-sm"></i>
                    <span class="text-xs font-bold text-slate-200">音视频笔记工作台</span>
                </div>
                <button id="insertTimestampBtn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs flex items-center space-x-1 transition">
                    <i class="fa-regular fa-clock"></i>
                    <span>插入当前时间戳</span>
                </button>
            </div>

            <div class="flex-1 p-3 bg-slate-900 flex flex-col">
                <textarea id="noteTextarea" class="w-full flex-1 bg-slate-950 text-slate-100 p-3 rounded-lg border border-slate-800 focus:border-sky-500 focus:outline-none font-sans text-sm resize-none leading-relaxed" placeholder="在此输入笔记内容... 点击右上方按钮可随时插入带有播放时间的快捷跳转链接 [MM:SS]"></textarea>
            </div>

            <div class="h-8 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-[11px] text-slate-500">
                <span id="saveStateText" class="text-amber-400/80">未绑定文件（点击“打开/绑定本地文件”后按 ⌘S 直接覆写）</span>
                <span id="wordCountText">0 字</span>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // ---------- DOM ----------
        const $ = (id) => document.getElementById(id);
        const mediaFileInput = $('mediaFileInput');
        const mainVideo = $('mainVideo');
        const audioCoverBox = $('audioCoverBox');
        const mediaFileName = $('mediaFileName');
        const playPauseBtn = $('playPauseBtn');
        const currentTimeDisplay = $('currentTimeDisplay');
        const mediaProgressBar = $('mediaProgressBar');

        const waveformScrollContainer = $('waveformScrollContainer');
        const waveformCanvas = $('waveformCanvas');
        const ctx = waveformCanvas.getContext('2d', { alpha: false });

        const zoomInBtn = $('zoomInBtn');
        const zoomOutBtn = $('zoomOutBtn');
        const zoomLevelDisplay = $('zoomLevelDisplay');
        const toggleAutoScrollBtn = $('toggleAutoScrollBtn');
        const autoScrollStatusText = $('autoScrollStatusText');

        const toggleLoopBtn = $('toggleLoopBtn');
        const loopStatusText = $('loopStatusText');
        const clearABBtn = $('clearABBtn');

        const inputTimeA = $('inputTimeA');
        const inputTimeB = $('inputTimeB');
        const aMinusBtn = $('aMinusBtn'), aPlusBtn = $('aPlusBtn');
        const bMinusBtn = $('bMinusBtn'), bPlusBtn = $('bPlusBtn');

        const noteTextarea = $('noteTextarea');
        const saveNoteBtn = $('saveNoteBtn');
        const saveBtnText = $('saveBtnText');
        const saveAsNoteBtn = $('saveAsNoteBtn');
        const openNativeFileBtn = $('openNativeFileBtn');
        const fallbackNoteFileInput = $('fallbackNoteFileInput');
        const insertTimestampBtn = $('insertTimestampBtn');
        const saveStateText = $('saveStateText');
        const wordCountText = $('wordCountText');

        const waveformResizer = $('waveformResizer');
        const waveformBox = $('waveformBox');
        const panelResizer = $('panelResizer');
        const leftPanel = $('leftPanel');
        const rightPanel = $('rightPanel');

        // ---------- 状态 ----------
        let audioCtx = null;
        let audioBuffer = null;
        let sourceNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;

        let mediaDuration = 0;
        let zoomLevel = 1.0;
        let isAutoScrollEnabled = true;
        let pointA = null;
        let pointB = null;
        let isLooping = false;

        let rawChannelData = null;
        let audioDataVersion = 0;   // 每次加载新音频 ++ 使缓存失效

        let isMouseDown = false;
        let dragMode = null;
        let dragStartX = 0;
        let dragStartA = 0;
        let dragOffsetTimeA = 0;
        let dragRangeDuration = 0;

        let currentFileHandle = null;
        let loadedFileName = '';

        // 渲染节流
        let renderScheduled = false;
        let cachedCanvasWidth = 0;
        let cachedCanvasHeight = 0;

        // 离屏波形缓存（避免每帧重绘全部采样）
        const waveCache = document.createElement('canvas');
        const waveCacheCtx = waveCache.getContext('2d', { alpha: false });
        let waveCacheKey = '';

        // 环境检测
        const hasFSAccess = typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
        const isFileProtocol = location.protocol === 'file:';

        if (!hasFSAccess) {
            saveStateText.textContent = isFileProtocol
                ? '⚠️ file:// 无法直写文件，请用 http://localhost 打开页面后绑定'
                : '⚠️ 当前浏览器不支持文件直写，仅能以“下载”方式保存';
            saveStateText.className = 'text-rose-400 font-semibold';
        }

        // ---------- 加载媒体 ----------
        async function loadMediaFile(file) {
            try {
                stopAudio();
                pauseOffset = 0;
                const arrayBuffer = await file.arrayBuffer();
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                mediaDuration = audioBuffer.duration;
                rawChannelData = audioBuffer.getChannelData(0);
                audioDataVersion++;

                mediaFileName.textContent = file.name;
                audioCoverBox.classList.remove('hidden');
                audioCoverBox.classList.add('flex');
                mainVideo.classList.add('hidden');
                pointA = null; pointB = null; isLooping = false;
                loopStatusText.textContent = '关';
                loopStatusText.className = 'text-rose-400';
                updateABInputs();

                requestDrawWaveform();
                updateProgress();
            } catch (err) {
                console.error('音频解码失败:', err);
                alert('无法解析该音视频文件，请尝试其他 mp3 / wav / mp4 格式。');
            }
        }

        mediaFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadMediaFile(file);
        });

        // ---------- 播放控制 ----------
        function playAudio(offset = 0) {
            if (!audioBuffer) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopAudio();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;

            if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
                if (offset < pointA || offset >= pointB) offset = pointA;
                sourceNode.loop = true;
                sourceNode.loopStart = pointA;
                sourceNode.loopEnd = pointB;
            } else {
                sourceNode.loop = false;
            }

            sourceNode.connect(audioCtx.destination);
            sourceNode.start(0, offset);

            startTime = audioCtx.currentTime - offset;
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

            sourceNode.onended = () => {
                if (!isLooping && isPlaying && (getCurrentTime() >= mediaDuration - 0.1)) {
                    stopAudio();
                    pauseOffset = 0;
                }
            };

            requestAnimationFrame(trackProgress);
        }

        function stopAudio() {
            if (sourceNode) {
                try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
                sourceNode = null;
            }
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

        function getCurrentTime() {
            if (!isPlaying) return pauseOffset;
            let cur = audioCtx.currentTime - startTime;
            if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
                if (cur >= pointB) {
                    const len = pointB - pointA;
                    cur = pointA + ((cur - pointA) % len);
                }
            }
            return Math.min(mediaDuration, Math.max(0, cur));
        }

        function seekAudio(targetTime) {
            pauseOffset = Math.max(0, Math.min(mediaDuration, targetTime));
            if (isPlaying) playAudio(pauseOffset);
            else { updateProgress(); requestDrawWaveform(); }
        }

        function togglePlay() {
            if (!audioBuffer) return;
            if (isPlaying) { pauseOffset = getCurrentTime(); stopAudio(); }
            else playAudio(pauseOffset);
        }

        playPauseBtn.addEventListener('click', togglePlay);
        audioCoverBox.addEventListener('click', togglePlay);

        // 播放循环：极致轻量化 —— 只做 drawImage + 画几条线
        function trackProgress() {
            if (!isPlaying) return;
            updateProgress();
            drawWaveform();          // 已缓存，成本极低
            requestAnimationFrame(trackProgress);
        }

        function updateProgress() {
            const cur = getCurrentTime();
            currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(mediaDuration)}`;
            mediaProgressBar.value = mediaDuration ? (cur / mediaDuration) * 100 : 0;
        }

        mediaProgressBar.addEventListener('input', (e) => {
            if (mediaDuration) seekAudio((e.target.value / 100) * mediaDuration);
        });

        // ---------- 波形渲染（缓存策略） ----------
        function requestDrawWaveform() {
            if (renderScheduled) return;
            renderScheduled = true;
            requestAnimationFrame(() => {
                renderScheduled = false;
                drawWaveform();
            });
        }

        function rebuildWaveCache(w, h) {
            waveCache.width = w;
            waveCache.height = h;
            waveCacheCtx.fillStyle = '#020617';
            waveCacheCtx.fillRect(0, 0, w, h);

            if (!rawChannelData) return;

            const midY = h / 2;
            const maxBar = midY * 0.88;
            const total = rawChannelData.length;
            const step = Math.max(1, Math.ceil(total / w));
            const data = rawChannelData;

            waveCacheCtx.fillStyle = '#38bdf8';
            for (let i = 0; i < w; i++) {
                const start = i * step;
                const end = Math.min(start + step, total);
                let min = 1.0, max = -1.0;
                for (let j = start; j < end; j++) {
                    const v = data[j];
                    if (v < min) min = v;
                    if (v > max) max = v;
                }
                const amp = Math.max(Math.abs(min), Math.abs(max));
                const bh = amp * maxBar;
                waveCacheCtx.fillRect(i, midY - bh, 1, Math.max(1, bh * 2));
            }

            waveCacheCtx.strokeStyle = '#1e293b';
            waveCacheCtx.beginPath();
            waveCacheCtx.moveTo(0, midY);
            waveCacheCtx.lineTo(w, midY);
            waveCacheCtx.stroke();
        }

        function drawWaveform() {
            const containerW = waveformScrollContainer.clientWidth;
            const containerH = waveformScrollContainer.clientHeight || 120;
            if (containerW <= 0 || containerH <= 0) return;

            // 限制 DPR 与最大宽度，避免超大 canvas 内存爆炸
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const MAX_CANVAS_PX = 16000;
            const cssWidth = Math.min(MAX_CANVAS_PX, Math.max(containerW, Math.ceil(containerW * zoomLevel)));
            const cssHeight = containerH;

            // 只在尺寸变化时重设（关键！避免每帧重新分配像素缓冲）
            if (cachedCanvasWidth !== cssWidth || cachedCanvasHeight !== cssHeight ||
                waveformCanvas.width !== Math.round(cssWidth * dpr)) {
                waveformCanvas.width = Math.round(cssWidth * dpr);
                waveformCanvas.height = Math.round(cssHeight * dpr);
                waveformCanvas.style.width = cssWidth + 'px';
                waveformCanvas.style.height = cssHeight + 'px';
                cachedCanvasWidth = cssWidth;
                cachedCanvasHeight = cssHeight;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // 波形缓存只在尺寸/数据变化时重建
            const cacheKey = `${cssWidth}x${cssHeight}|v${audioDataVersion}`;
            if (waveCacheKey !== cacheKey) {
                rebuildWaveCache(cssWidth, cssHeight);
                waveCacheKey = cacheKey;
            }

            if (!rawChannelData) {
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, cssWidth, cssHeight);
                ctx.fillStyle = '#475569';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('请点击上方打开音频文件，此处将呈现高精度绝无偏差波形', cssWidth / 2, cssHeight / 2);
                return;
            }

            // 只做一次贴图 + 极少量线条绘制
            ctx.drawImage(waveCache, 0, 0, cssWidth, cssHeight);

            const duration = mediaDuration;
            if (duration <= 0) return;

            const midY = cssHeight / 2;

            // A / B 标记
            if (pointA !== null && pointB !== null) {
                const xA = (pointA / duration) * cssWidth;
                const xB = (pointB / duration) * cssWidth;
                const startX = Math.min(xA, xB), endX = Math.max(xA, xB);

                ctx.fillStyle = 'rgba(14, 165, 233, 0.22)';
                ctx.fillRect(startX, 0, endX - startX, cssHeight);
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(startX, 0, endX - startX, 2);
                ctx.fillRect(startX, cssHeight - 2, endX - startX, 2);

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(xA, 0);
                ctx.lineTo(xA, cssHeight);
                ctx.stroke();
                ctx.fillStyle = '#10b981';
                ctx.fillRect(xA - 7, 0, 14, 18);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('A', xA, 13);

                ctx.strokeStyle = '#f43f5e';
                ctx.beginPath();
                ctx.moveTo(xB, 0);
                ctx.lineTo(xB, cssHeight);
                ctx.stroke();
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(xB - 7, 0, 14, 18);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('B', xB, 13);
            }

            // 播放头
            const playX = (getCurrentTime() / duration) * cssWidth;
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(playX, 0);
            ctx.lineTo(playX, cssHeight);
            ctx.stroke();

            if (isAutoScrollEnabled && zoomLevel > 1.0 && isPlaying) {
                waveformScrollContainer.scrollLeft = playX - containerW / 2;
            }
        }

        // ---------- 点击 / 拖拽（缓存 rect） ----------
        let cachedRect = null;
        function refreshRect() {
            cachedRect = waveformCanvas.getBoundingClientRect();
        }
        window.addEventListener('scroll', refreshRect, { passive: true });
        window.addEventListener('resize', () => { refreshRect(); requestDrawWaveform(); }, { passive: true });
        new ResizeObserver(() => { refreshRect(); requestDrawWaveform(); }).observe(waveformScrollContainer);

        function timeFromClientX(clientX) {
            if (!cachedRect) refreshRect();
            const cssWidth = cachedRect.width || 1;
            const x = clientX - cachedRect.left;
            return Math.max(0, Math.min(mediaDuration, (x / cssWidth) * mediaDuration));
        }
        function xFromClientX(clientX) {
            if (!cachedRect) refreshRect();
            return clientX - cachedRect.left;
        }

        zoomInBtn.addEventListener('click', () => {
            zoomLevel = Math.min(20.0, zoomLevel + 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            requestDrawWaveform();
        });
        zoomOutBtn.addEventListener('click', () => {
            zoomLevel = Math.max(1.0, zoomLevel - 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            requestDrawWaveform();
        });
        toggleAutoScrollBtn.addEventListener('click', () => {
            isAutoScrollEnabled = !isAutoScrollEnabled;
            autoScrollStatusText.textContent = isAutoScrollEnabled ? '开' : '关';
            autoScrollStatusText.className = isAutoScrollEnabled ? 'text-emerald-400' : 'text-rose-400';
        });

        waveformCanvas.addEventListener('mousedown', (e) => {
            if (!mediaDuration) return;
            refreshRect();
            isMouseDown = true;
            dragStartX = e.clientX;
            const clickTime = timeFromClientX(e.clientX);
            const clickX = xFromClientX(e.clientX);
            const cssWidth = cachedRect.width;

            if (pointA !== null && pointB !== null) {
                const xA = (pointA / mediaDuration) * cssWidth;
                const xB = (pointB / mediaDuration) * cssWidth;

                if (Math.abs(clickX - xA) <= 12) { dragMode = 'A'; return; }
                if (Math.abs(clickX - xB) <= 12) { dragMode = 'B'; return; }
                if (clickX > Math.min(xA, xB) && clickX < Math.max(xA, xB)) {
                    dragMode = 'RANGE';
                    dragOffsetTimeA = clickTime - pointA;
                    dragRangeDuration = pointB - pointA;
                    waveformCanvas.style.cursor = 'grabbing';
                    return;
                }
            }
            dragMode = 'SELECT';
            dragStartA = clickTime;
        });

        // 悬停光标（仅 canvas 上监听，rAF 节流）
        let hoverRaf = 0;
        let hoverX = 0;
        waveformCanvas.addEventListener('mousemove', (e) => {
            if (isMouseDown) return;
            hoverX = e.clientX;
            if (hoverRaf) return;
            hoverRaf = requestAnimationFrame(() => {
                hoverRaf = 0;
                if (!pointA || !pointB || !mediaDuration) { waveformCanvas.style.cursor = 'crosshair'; return; }
                const cssWidth = cachedRect ? cachedRect.width : waveformCanvas.clientWidth;
                const cx = xFromClientX(hoverX);
                const xA = (pointA / mediaDuration) * cssWidth;
                const xB = (pointB / mediaDuration) * cssWidth;
                if (Math.abs(cx - xA) <= 12 || Math.abs(cx - xB) <= 12) waveformCanvas.style.cursor = 'col-resize';
                else if (cx > Math.min(xA, xB) && cx < Math.max(xA, xB)) waveformCanvas.style.cursor = 'grab';
                else waveformCanvas.style.cursor = 'crosshair';
            });
        }, { passive: true });

        // 拖拽在 window 上，且 rAF 节流
        let dragRaf = 0;
        let pendingMoveX = 0;
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || !dragMode || !mediaDuration) return;
            pendingMoveX = e.clientX;
            if (dragRaf) return;
            dragRaf = requestAnimationFrame(() => {
                dragRaf = 0;
                const currentTime = timeFromClientX(pendingMoveX);
                if (dragMode === 'A') {
                    pointA = Math.min(currentTime, pointB - 0.1);
                } else if (dragMode === 'B') {
                    pointB = Math.max(currentTime, pointA + 0.1);
                } else if (dragMode === 'RANGE') {
                    let newA = currentTime - dragOffsetTimeA;
                    if (newA < 0) newA = 0;
                    if (newA + dragRangeDuration > mediaDuration) newA = mediaDuration - dragRangeDuration;
                    pointA = newA; pointB = newA + dragRangeDuration;
                } else if (dragMode === 'SELECT') {
                    pointA = Math.min(dragStartA, currentTime);
                    pointB = Math.max(dragStartA, currentTime);
                }
                enforceABConstraint();
                updateABInputs();
                requestDrawWaveform();
            });
        }, { passive: true });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            const moveDist = Math.abs(e.clientX - dragStartX);
            if (dragMode === 'SELECT' && moveDist < 5 && mediaDuration > 0) {
                const clickTime = timeFromClientX(e.clientX);
                pointA = clickTime;
                pointB = Math.min(mediaDuration, clickTime + 3.0);
                seekAudio(clickTime);
            }
            if (dragMode === 'RANGE') waveformCanvas.style.cursor = 'grab';
            isMouseDown = false;
            dragMode = null;
            enforceABConstraint();
            updateABInputs();
            if (isLooping && isPlaying) playAudio(getCurrentTime());
            requestDrawWaveform();
        });

        function enforceABConstraint() {
            if (pointA !== null && pointB !== null) {
                if (pointB < pointA) { const t = pointA; pointA = pointB; pointB = t; }
                if (pointB - pointA < 0.1) pointB = pointA + 0.1;
            }
        }

        toggleLoopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopStatusText.textContent = isLooping ? '开' : '关';
            loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
            if (isPlaying) playAudio(getCurrentTime());
        });

        clearABBtn.addEventListener('click', () => {
            pointA = null; pointB = null; isLooping = false;
            loopStatusText.textContent = '关';
            loopStatusText.className = 'text-rose-400';
            updateABInputs();
            if (isPlaying) playAudio(getCurrentTime());
            requestDrawWaveform();
        });

        function updateABInputs() {
            inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
            inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
        }

        inputTimeA.addEventListener('change', () => { pointA = parseFloat(inputTimeA.value) || 0; enforceABConstraint(); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); });
        inputTimeB.addEventListener('change', () => { pointB = parseFloat(inputTimeB.value) || 0; enforceABConstraint(); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); });
        aMinusBtn.addEventListener('click', () => { if (pointA !== null) { pointA = Math.max(0, pointA - 0.1); enforceABConstraint(); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); } });
        aPlusBtn.addEventListener('click', () => { if (pointA !== null) { pointA += 0.1; enforceABConstraint(); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); } });
        bMinusBtn.addEventListener('click', () => { if (pointB !== null) { pointB = Math.max(pointA + 0.1, pointB - 0.1); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); } });
        bPlusBtn.addEventListener('click', () => { if (pointB !== null) { pointB += 0.1; enforceABConstraint(); updateABInputs(); if (isPlaying) playAudio(getCurrentTime()); requestDrawWaveform(); } });

        // ---------- 键盘 ----------
        window.addEventListener('keydown', (e) => {
            // 打字时提前退出，避免任何干扰
            const inTextarea = document.activeElement === noteTextarea;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveNoteDirectly();
                return;
            }
            if (!inTextarea && document.activeElement.tagName !== 'INPUT' && e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // ---------- 文件保存 ----------
        async function ensureWritePermission(handle) {
            if (!handle.queryPermission) return true;
            const opts = { mode: 'readwrite' };
            if ((await handle.queryPermission(opts)) === 'granted') return true;
            if ((await handle.requestPermission(opts)) === 'granted') return true;
            return false;
        }

        openNativeFileBtn.addEventListener('click', async () => {
            if (!hasFSAccess) {
                // 回退：仅读，无句柄
                fallbackNoteFileInput.click();
                return;
            }
            try {
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'Markdown/Text', accept: { 'text/plain': ['.md', '.txt', '.markdown'] } }]
                });
                currentFileHandle = handle;
                const file = await handle.getFile();
                loadedFileName = file.name;
                const text = await file.text();
                noteTextarea.value = text;
                wordCountText.textContent = `${text.length} 字`;
                saveStateText.textContent = `已绑定原文件: ${file.name}（⌘S 直接静默覆写）`;
                saveStateText.className = 'text-emerald-400 font-semibold';
                saveBtnText.textContent = '覆写保存 (⌘S)';
            } catch (e) {
                if (e.name !== 'AbortError') console.warn('打开文件失败:', e);
            }
        });

        fallbackNoteFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                noteTextarea.value = evt.target.result;
                loadedFileName = file.name;
                wordCountText.textContent = `${evt.target.result.length} 字`;
                saveStateText.textContent = `已载入文本: ${file.name}（当前环境无法直写，仅能下载保存）`;
                saveStateText.className = 'text-amber-400 font-semibold';
            };
            reader.readAsText(file);
        });

        async function saveNoteDirectly() {
            const content = noteTextarea.value;
            const timeNow = new Date().toLocaleTimeString();

            // 1) 优先：已有句柄 → 静默覆写
            if (currentFileHandle) {
                try {
                    if (await ensureWritePermission(currentFileHandle)) {
                        const writable = await currentFileHandle.createWritable();
                        await writable.write(content);
                        await writable.close();
                        saveStateText.textContent = `已于 ${timeNow} 覆写保存到: ${currentFileHandle.name}`;
                        saveStateText.className = 'text-emerald-400 font-semibold';
                        // 顺手再存一份到 localStorage 兜底
                        try { localStorage.setItem('local_note_backup', content); } catch (_) {}
                        return;
                    }
                } catch (err) {
                    console.warn('句柄写入失败:', err);
                }
                // 失败则继续走"另存为"流程
            }

            // 2) 首次或权限失效 → 弹一次保存对话框并绑定
            if (hasFSAccess) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: loadedFileName || `Note_${new Date().toISOString().slice(0,10)}.md`,
                        types: [{ description: 'Markdown/Text', accept: { 'text/plain': ['.md', '.txt'] } }]
                    });
                    currentFileHandle = handle;
                    loadedFileName = handle.name;
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    saveStateText.textContent = `已绑定并保存到: ${handle.name}（之后 ⌘S 直接覆盖）`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    saveBtnText.textContent = '覆写保存 (⌘S)';
                    try { localStorage.setItem('local_note_backup', content); } catch (_) {}
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                    console.warn('保存失败:', e);
                }
            }

            // 3) 最后兜底：下载
            downloadTextFile(content, loadedFileName || `Note_${new Date().toISOString().slice(0,10)}.txt`);
            saveStateText.textContent = `已于 ${timeNow} 导出下载（当前环境不支持直写）`;
            saveStateText.className = 'text-amber-400 font-semibold';
        }

        function downloadTextFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        saveNoteBtn.addEventListener('click', saveNoteDirectly);
        saveAsNoteBtn.addEventListener('click', async () => {
            currentFileHandle = null;
            saveBtnText.textContent = '保存笔记 (⌘S)';
            await saveNoteDirectly();
        });

        insertTimestampBtn.addEventListener('click', () => {
            const timeStr = `[${formatTime(getCurrentTime())}] `;
            const start = noteTextarea.selectionStart;
            const text = noteTextarea.value;
            noteTextarea.value = text.substring(0, start) + timeStr + text.substring(noteTextarea.selectionEnd);
            noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
            noteTextarea.focus();
        });

        // ---------- 输入防抖 ----------
        let wordCountTimer = 0;
        let persistTimer = 0;
        noteTextarea.addEventListener('input', () => {
            clearTimeout(wordCountTimer);
            wordCountTimer = setTimeout(() => {
                wordCountText.textContent = `${noteTextarea.value.length} 字`;
            }, 120);
            clearTimeout(persistTimer);
            persistTimer = setTimeout(() => {
                try { localStorage.setItem('local_note_backup', noteTextarea.value); } catch (_) {}
            }, 800);
        }, { passive: true });

        try {
            const savedNote = localStorage.getItem('local_note_backup');
            if (savedNote) {
                noteTextarea.value = savedNote;
                wordCountText.textContent = `${savedNote.length} 字`;
            }
        } catch (_) {}

        // ---------- 面板拖拽 ----------
        let isResizingH = false, isResizingV = false;
        waveformResizer.addEventListener('mousedown', (e) => { isResizingH = true; e.preventDefault(); });
        panelResizer.addEventListener('mousedown', (e) => { isResizingV = true; e.preventDefault(); });

        window.addEventListener('mousemove', (e) => {
            if (isResizingH) {
                const rect = leftPanel.getBoundingClientRect();
                const newH = rect.bottom - e.clientY;
                if (newH > 100 && newH < rect.height - 120) {
                    waveformBox.style.height = `${newH}px`;
                    requestDrawWaveform();
                }
            }
            if (isResizingV) {
                const cw = $('mainContainer').clientWidth;
                const newW = cw - e.clientX;
                if (newW > 280 && newW < cw - 300) {
                    rightPanel.style.width = `${newW}px`;
                    requestDrawWaveform();
                }
            }
        }, { passive: true });

        window.addEventListener('mouseup', () => {
            isResizingH = false;
            isResizingV = false;
        }, { passive: true });

        // ---------- 工具 ----------
        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return '00:00.0';
            const m = Math.floor(sec / 60);
            const s = (sec % 60).toFixed(1);
            return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        }

        // 初始化
        refreshRect();
        requestDrawWaveform();
    })();
    </script>
</body>
</html>
