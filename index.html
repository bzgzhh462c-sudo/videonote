<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioVisualizer Studio Pro - 音视频分析与笔记工作站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Canvas Waveform Box */
        .waveform-container {
            user-select: none;
            touch-action: none;
        }
        /* Resize handles */
        .resizer-h {
            cursor: row-resize;
            height: 6px;
        }
        .resizer-v {
            cursor: col-resize;
            width: 6px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Header / Top Bar -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-photo-film text-lg"></i>
            </div>
            <h1 class="text-base font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                AudioVisualizer Studio Pro <span class="text-xs px-2 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800">Media Studio</span>
            </h1>
        </div>

        <!-- File Controls -->
        <div class="flex items-center space-x-3 text-xs">
            <label class="cursor-pointer bg-sky-600 hover:bg-sky-500 text-white font-medium px-3 py-1.5 rounded-md flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-folder-open"></i>
                <span>打开音视频文件</span>
                <input type="file" id="mediaFileInput" accept="video/*,audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" class="hidden">
            </label>
            <div class="h-4 w-px bg-slate-700"></div>
            <!-- Save to File Btn -->
            <button id="saveNoteBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-md border border-emerald-600 flex items-center space-x-1.5 transition" title="直接覆盖保存到已绑定文件 (Cmd/Ctrl+S)">
                <i class="fa-solid fa-floppy-disk"></i>
                <span id="saveBtnText">保存笔记 (⌘S)</span>
            </button>
            <!-- Save As Btn -->
            <button id="saveAsNoteBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1 transition" title="另存为新文件">
                <i class="fa-solid fa-file-export text-sky-400"></i>
                <span>另存为...</span>
            </button>
            <!-- Native Open File Button -->
            <button id="openNativeFileBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-md border border-slate-700 flex items-center space-x-1.5 transition" title="打开本地笔记文件并开启直接覆盖权限">
                <i class="fa-solid fa-file-import text-amber-400"></i>
                <span>打开/绑定本地文件</span>
            </button>
        </div>
    </header>

    <!-- Main Studio Split Layout -->
    <div id="mainContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Left Panel: Video/Audio Analysis Studio -->
        <div id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-slate-900/50 overflow-hidden">
            
            <!-- Video / Audio Player Window -->
            <div id="mediaContainer" class="flex-1 bg-black flex items-center justify-center relative overflow-hidden group">
                <video id="mainMedia" class="max-h-full max-w-full object-contain"></video>

                <!-- Audio Placeholder Cover -->
                <div id="audioPlaceholder" class="hidden flex-col items-center justify-center space-y-3 text-slate-500">
                    <i class="fa-solid fa-music text-6xl text-sky-500/80 animate-pulse"></i>
                    <span id="audioFileName" class="text-sm font-medium text-slate-400">纯音频模式播放中</span>
                </div>
                
                <!-- Custom Floating Media Controls Overlay -->
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-3">
                    <button id="playPauseBtn" class="text-white hover:text-sky-400 text-xl w-8 h-8 flex items-center justify-center">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <span id="currentTimeDisplay" class="text-xs font-mono text-slate-300">00:00.0 / 00:00.0</span>
                    <input type="range" id="mediaProgressBar" value="0" step="0.01" class="flex-1 accent-sky-500 bg-slate-700 h-1.5 rounded cursor-pointer">
                    <button id="muteBtn" class="text-slate-300 hover:text-white text-sm">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>

            <!-- Waveform Resizer Bar -->
            <div id="waveformResizer" class="resizer-h bg-slate-800 hover:bg-sky-500 transition-colors flex items-center justify-center border-y border-slate-700/50">
                <div class="w-8 h-1 bg-slate-600 rounded-full"></div>
            </div>

            <!-- Waveform & Controls Region -->
            <div id="waveformBox" class="h-48 bg-slate-950 flex flex-col border-t border-slate-800 shrink-0 relative">
                
                <!-- Waveform Toolbar -->
                <div class="h-9 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 text-xs">
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-400 font-medium"><i class="fa-solid fa-wave-square text-sky-400 mr-1"></i>波形:</span>
                        <button id="zoomOutBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-minus"></i> 缩小
                        </button>
                        <span id="zoomLevelDisplay" class="font-mono text-sky-400">1.0x</span>
                        <button id="zoomInBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-200">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> 放大
                        </button>

                        <div class="h-3 w-px bg-slate-700 mx-1"></div>

                        <!-- Auto-Scroll Toggle Button -->
                        <button id="toggleAutoScrollBtn" class="px-2.5 py-0.5 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-800 rounded flex items-center space-x-1 transition">
                            <i class="fa-solid fa-arrows-to-eye"></i>
                            <span>波形跟随: <b id="autoScrollStatusText" class="text-emerald-400">开</b></span>
                        </button>
                    </div>

                    <!-- AB Loop & Clear Controls -->
                    <div class="flex items-center space-x-2">
                        <button id="toggleLoopBtn" class="px-2.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>AB 循环: <b id="loopStatusText" class="text-rose-400">关</b></span>
                        </button>
                        <button id="clearABBtn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded flex items-center space-x-1">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>清除 A-B</span>
                        </button>
                    </div>
                </div>

                <!-- Canvas Waveform Canvas Container -->
                <div id="waveformScrollContainer" class="flex-1 overflow-x-auto overflow-y-hidden relative waveform-container bg-slate-950">
                    <canvas id="waveformCanvas" class="h-full block cursor-crosshair"></canvas>
                </div>

                <!-- AB Precision Fine Tuning Bar -->
                <div class="h-8 bg-slate-900/80 border-t border-slate-800/80 flex items-center justify-between px-3 text-xs font-mono">
                    <div class="flex items-center space-x-2">
                        <span class="text-emerald-400">A 点:</span>
                        <input type="number" id="inputTimeA" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-emerald-400">
                        <button id="aMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="aPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                    <div class="text-slate-500 text-[10px]">单击波形设A点(自动加1秒作为B点) | 拖拽直接划选A-B | 按住选区平移</div>
                    <div class="flex items-center space-x-2">
                        <span class="text-rose-400">B 点:</span>
                        <input type="number" id="inputTimeB" step="0.1" min="0" value="0.0" class="w-16 bg-slate-950 border border-slate-700 rounded px-1 text-rose-400">
                        <button id="bMinusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">-0.1s</button>
                        <button id="bPlusBtn" class="px-1.5 py-0.5 bg-slate-800 rounded hover:bg-slate-700">+0.1s</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vertical Split Resizer between Media and Note Panel -->
        <div id="panelResizer" class="resizer-v bg-slate-800 hover:bg-sky-500 transition-colors hidden md:block border-x border-slate-700/50"></div>

        <!-- Right Panel: Note Editor Only -->
        <div id="rightPanel" class="w-full md:w-[420px] flex flex-col bg-slate-900 shrink-0 border-l border-slate-800">
            
            <!-- Note Editor Header -->
            <div class="p-3 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-amber-400 text-sm"></i>
                    <span class="text-xs font-bold text-slate-200">音视频笔记工作台</span>
                </div>
                <button id="insertTimestampBtn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs flex items-center space-x-1 transition">
                    <i class="fa-regular fa-clock"></i>
                    <span>插入当前时间戳</span>
                </button>
            </div>

            <!-- Note Textarea -->
            <div class="flex-1 p-3 bg-slate-900 flex flex-col">
                <textarea id="noteTextarea" class="w-full flex-1 bg-slate-950 text-slate-100 p-3 rounded-lg border border-slate-800 focus:border-sky-500 focus:outline-none font-sans text-sm resize-none leading-relaxed" placeholder="在此输入笔记内容... 点击右上方按钮可随时插入带有播放时间的快捷跳转链接 [MM:SS]"></textarea>
            </div>

            <!-- Note Status Footer -->
            <div class="h-8 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-[11px] text-slate-500">
                <span id="saveStateText" class="text-amber-400/80">未绑定文件（首次保存将要求选择一次保存路径）</span>
                <span id="wordCountText">0 字</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // DOM Elements
        const mediaFileInput = document.getElementById('mediaFileInput');
        const mainMedia = document.getElementById('mainMedia');
        const audioPlaceholder = document.getElementById('audioPlaceholder');
        const audioFileName = document.getElementById('audioFileName');

        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const mediaProgressBar = document.getElementById('mediaProgressBar');
        const muteBtn = document.getElementById('muteBtn');

        const waveformScrollContainer = document.getElementById('waveformScrollContainer');
        const waveformCanvas = document.getElementById('waveformCanvas');
        const ctx = waveformCanvas.getContext('2d');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
        const toggleAutoScrollBtn = document.getElementById('toggleAutoScrollBtn');
        const autoScrollStatusText = document.getElementById('autoScrollStatusText');

        const toggleLoopBtn = document.getElementById('toggleLoopBtn');
        const loopStatusText = document.getElementById('loopStatusText');
        const clearABBtn = document.getElementById('clearABBtn');

        const inputTimeA = document.getElementById('inputTimeA');
        const inputTimeB = document.getElementById('inputTimeB');
        const aMinusBtn = document.getElementById('aMinusBtn');
        const aPlusBtn = document.getElementById('aPlusBtn');
        const bMinusBtn = document.getElementById('bMinusBtn');
        const bPlusBtn = document.getElementById('bPlusBtn');

        const noteTextarea = document.getElementById('noteTextarea');
        const saveNoteBtn = document.getElementById('saveNoteBtn');
        const saveBtnText = document.getElementById('saveBtnText');
        const saveAsNoteBtn = document.getElementById('saveAsNoteBtn');
        const openNativeFileBtn = document.getElementById('openNativeFileBtn');
        const insertTimestampBtn = document.getElementById('insertTimestampBtn');
        const saveStateText = document.getElementById('saveStateText');
        const wordCountText = document.getElementById('wordCountText');

        // Layout Resizers
        const waveformResizer = document.getElementById('waveformResizer');
        const waveformBox = document.getElementById('waveformBox');
        const panelResizer = document.getElementById('panelResizer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');

        // Audio Context for Anti-Click Fade Smoothing
        let audioContext = null;
        let gainNode = null;
        let mediaSource = null;

        // Application State
        let audioBuffer = null;
        let zoomLevel = 1.0;
        let isAutoScrollEnabled = true;
        let pointA = null;
        let pointB = null;
        let isLooping = false;

        // Mouse Dragging States
        let isMouseDown = false;
        let dragMode = null; // 'A', 'B', 'RANGE', 'SELECT'
        let dragStartX = 0;
        let dragStartA = 0;
        let dragStartB = 0;
        let dragOffsetTimeA = 0;
        let dragRangeDuration = 0;
        let currentFileHandle = null;

        // --- Initialize Audio Context with Fade Smoothing ---
        function initAudioSmooth() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                gainNode = audioContext.createGain();
                mediaSource = audioContext.createMediaElementSource(mainMedia);
                mediaSource.connect(gainNode);
                gainNode.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Apply Micro-Fade to Eliminate Clicking/Popping Noise
        function smoothJumpTo(targetTime) {
            if (gainNode && audioContext) {
                const now = audioContext.currentTime;
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.01); // 10ms Fast Fade-Out
                
                setTimeout(() => {
                    mainMedia.currentTime = targetTime;
                    const resumeTime = audioContext.currentTime;
                    gainNode.gain.setValueAtTime(0, resumeTime);
                    gainNode.gain.linearRampToValueAtTime(1, resumeTime + 0.015); // 15ms Smooth Fade-In
                }, 10);
            } else {
                mainMedia.currentTime = targetTime;
            }
        }

        // --- 1. Audio Processing & Waveform Extraction ---
        async function loadMediaAudio(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                drawWaveform();
            } catch (err) {
                console.warn('音频轨解析提示：文件可能无音频轨或格式不兼容。', err);
                audioBuffer = null;
                drawWaveform();
            }
        }

        function drawWaveform() {
            const containerWidth = waveformScrollContainer.clientWidth;
            const canvasWidth = Math.max(containerWidth, containerWidth * zoomLevel);
            const canvasHeight = waveformScrollContainer.clientHeight || 120;

            waveformCanvas.width = canvasWidth;
            waveformCanvas.height = canvasHeight;

            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            if (!audioBuffer) {
                ctx.fillStyle = '#475569';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('选择或拖入音视频文件后在此呈现极清晰波形', canvasWidth / 2, canvasHeight / 2);
                return;
            }

            const rawData = audioBuffer.getChannelData(0);
            const totalSamples = rawData.length;
            const step = Math.ceil(totalSamples / canvasWidth);
            const midY = canvasHeight / 2;

            let maxAmp = 0;
            const peaks = new Float32Array(canvasWidth);
            for (let i = 0; i < canvasWidth; i++) {
                let min = 1.0, max = -1.0;
                const start = i * step;
                for (let j = 0; j < step && (start + j) < totalSamples; j++) {
                    const val = rawData[start + j];
                    if (val < min) min = val;
                    if (val > max) max = val;
                }
                const amp = Math.max(Math.abs(min), Math.abs(max));
                peaks[i] = amp;
                if (amp > maxAmp) maxAmp = amp;
            }

            const scale = maxAmp > 0 ? (midY * 0.85) / maxAmp : midY * 0.85;

            ctx.fillStyle = '#38bdf8';
            for (let i = 0; i < canvasWidth; i++) {
                const h = peaks[i] * scale;
                ctx.fillRect(i, midY - h, 1, h * 2 || 1);
            }

            ctx.strokeStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(0, midY);
            ctx.lineTo(canvasWidth, midY);
            ctx.stroke();

            const duration = mainMedia.duration || audioBuffer.duration;
            if (duration > 0) {
                if (pointA !== null && pointB !== null) {
                    const xA = (pointA / duration) * canvasWidth;
                    const xB = (pointB / duration) * canvasWidth;
                    const startX = Math.min(xA, xB);
                    const endX = Math.max(xA, xB);

                    ctx.fillStyle = 'rgba(14, 165, 233, 0.25)';
                    ctx.fillRect(startX, 0, endX - startX, canvasHeight);

                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(startX, 0, endX - startX, 2);
                    ctx.fillRect(startX, canvasHeight - 2, endX - startX, 2);

                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(xA, 0);
                    ctx.lineTo(xA, canvasHeight);
                    ctx.stroke();

                    ctx.fillStyle = '#10b981';
                    ctx.fillRect(xA - 5, 0, 10, 16);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('A', xA, 12);

                    ctx.strokeStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.moveTo(xB, 0);
                    ctx.lineTo(xB, canvasHeight);
                    ctx.stroke();

                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(xB - 5, 0, 10, 16);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('B', xB, 12);
                }

                const playX = (mainMedia.currentTime / duration) * canvasWidth;
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(playX, 0);
                ctx.lineTo(playX, canvasHeight);
                ctx.stroke();
            }
        }

        // --- 2. Media Player & Progress Interactions ---
        mediaFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                mainMedia.src = url;

                if (file.type.startsWith('audio/')) {
                    audioPlaceholder.classList.remove('hidden');
                    audioPlaceholder.classList.add('flex');
                    audioFileName.textContent = file.name;
                    mainMedia.classList.add('hidden');
                } else {
                    audioPlaceholder.classList.add('hidden');
                    audioPlaceholder.classList.remove('flex');
                    mainMedia.classList.remove('hidden');
                }

                loadMediaAudio(file);
            }
        });

        playPauseBtn.addEventListener('click', () => { initAudioSmooth(); togglePlay(); });
        mainMedia.addEventListener('click', () => { initAudioSmooth(); togglePlay(); });
        audioPlaceholder.addEventListener('click', () => { initAudioSmooth(); togglePlay(); });

        function togglePlay() {
            if (mainMedia.paused) {
                mainMedia.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                mainMedia.pause();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        mainMedia.addEventListener('timeupdate', () => {
            const cur = mainMedia.currentTime;
            const dur = mainMedia.duration || 0;

            currentTimeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
            mediaProgressBar.value = dur ? (cur / dur) * 100 : 0;

            // Strict AB Loop Check with Micro-Fade Smoothing to Eliminate Pop Noise
            if (isLooping && pointA !== null && pointB !== null && pointA < pointB) {
                if (cur >= pointB || cur < pointA) {
                    smoothJumpTo(pointA);
                }
            }

            if (isAutoScrollEnabled && zoomLevel > 1.0 && dur > 0) {
                const canvasWidth = waveformCanvas.width;
                const playX = (cur / dur) * canvasWidth;
                const containerWidth = waveformScrollContainer.clientWidth;
                waveformScrollContainer.scrollLeft = playX - containerWidth / 2;
            }

            drawWaveform();
        });

        mediaProgressBar.addEventListener('input', (e) => {
            const dur = mainMedia.duration || 0;
            if (dur) {
                initAudioSmooth();
                smoothJumpTo((e.target.value / 100) * dur);
            }
        });

        // --- 3. Waveform Zoom & Mouse Selection ---
        zoomInBtn.addEventListener('click', () => {
            zoomLevel = Math.min(20.0, zoomLevel + 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            drawWaveform();
        });

        zoomOutBtn.addEventListener('click', () => {
            zoomLevel = Math.max(1.0, zoomLevel - 1.0);
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            drawWaveform();
        });

        toggleAutoScrollBtn.addEventListener('click', () => {
            isAutoScrollEnabled = !isAutoScrollEnabled;
            autoScrollStatusText.textContent = isAutoScrollEnabled ? '开' : '关';
            autoScrollStatusText.className = isAutoScrollEnabled ? 'text-emerald-400' : 'text-rose-400';
        });

        waveformCanvas.addEventListener('mousedown', (e) => {
            initAudioSmooth();
            isMouseDown = true;
            dragStartX = e.clientX;
            const rect = waveformCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const duration = mainMedia.duration || 0;
            if (!duration) return;

            const clickTime = (clickX / waveformCanvas.width) * duration;

            if (pointA !== null && pointB !== null) {
                const xA = (pointA / duration) * waveformCanvas.width;
                const xB = (pointB / duration) * waveformCanvas.width;

                if (Math.abs(clickX - xA) < 12) {
                    dragMode = 'A';
                    return;
                }
                if (Math.abs(clickX - xB) < 12) {
                    dragMode = 'B';
                    return;
                }
                if (clickX > Math.min(xA, xB) && clickX < Math.max(xA, xB)) {
                    dragMode = 'RANGE';
                    dragOffsetTimeA = clickTime - pointA;
                    dragRangeDuration = pointB - pointA;
                    waveformCanvas.style.cursor = 'grabbing';
                    return;
                }
            }

            dragMode = 'SELECT';
            dragStartA = clickTime;
            dragStartB = clickTime;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = waveformCanvas.getBoundingClientRect();
            const currentX = Math.max(0, Math.min(e.clientX - rect.left, waveformCanvas.width));
            const duration = mainMedia.duration || 0;

            if (!duration) return;

            const currentTime = (currentX / waveformCanvas.width) * duration;

            if (!isMouseDown && pointA !== null && pointB !== null) {
                const xA = (pointA / duration) * waveformCanvas.width;
                const xB = (pointB / duration) * waveformCanvas.width;
                if (Math.abs(currentX - xA) < 12 || Math.abs(currentX - xB) < 12) {
                    waveformCanvas.style.cursor = 'col-resize';
                } else if (currentX > Math.min(xA, xB) && currentX < Math.max(xA, xB)) {
                    waveformCanvas.style.cursor = 'grab';
                } else {
                    waveformCanvas.style.cursor = 'crosshair';
                }
            }

            if (!isMouseDown || !dragMode) return;

            if (dragMode === 'A') {
                pointA = Math.min(currentTime, pointB - 0.1);
            } else if (dragMode === 'B') {
                pointB = Math.max(currentTime, pointA + 0.1);
            } else if (dragMode === 'RANGE') {
                let newA = currentTime - dragOffsetTimeA;
                if (newA < 0) newA = 0;
                if (newA + dragRangeDuration > duration) newA = duration - dragRangeDuration;
                pointA = newA;
                pointB = newA + dragRangeDuration;
            } else if (dragMode === 'SELECT') {
                pointA = Math.min(dragStartA, currentTime);
                pointB = Math.max(dragStartA, currentTime);
            }

            enforceABConstraint();
            updateABInputs();
            drawWaveform();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            const duration = mainMedia.duration || 0;
            const moveDist = Math.abs(e.clientX - dragStartX);

            if (dragMode === 'SELECT' && moveDist < 5) {
                const rect = waveformCanvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                if (duration > 0) {
                    const clickTime = (clickX / waveformCanvas.width) * duration;
                    pointA = clickTime;
                    pointB = Math.min(duration, clickTime + 1.0);
                    smoothJumpTo(clickTime);
                }
            }

            if (dragMode === 'RANGE') {
                waveformCanvas.style.cursor = 'grab';
            }

            isMouseDown = false;
            dragMode = null;
            enforceABConstraint();
            updateABInputs();
            drawWaveform();
        });

        function enforceABConstraint() {
            if (pointA !== null && pointB !== null) {
                if (pointB < pointA) {
                    const temp = pointA;
                    pointA = pointB;
                    pointB = temp;
                }
                if (pointB - pointA < 0.1) {
                    pointB = pointA + 0.1;
                }
            }
        }

        // AB Control Buttons
        toggleLoopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopStatusText.textContent = isLooping ? '开' : '关';
            loopStatusText.className = isLooping ? 'text-emerald-400' : 'text-rose-400';
        });

        clearABBtn.addEventListener('click', () => {
            pointA = null;
            pointB = null;
            isLooping = false;
            loopStatusText.textContent = '关';
            loopStatusText.className = 'text-rose-400';
            updateABInputs();
            drawWaveform();
        });

        function updateABInputs() {
            inputTimeA.value = pointA !== null ? pointA.toFixed(1) : '0.0';
            inputTimeB.value = pointB !== null ? pointB.toFixed(1) : '0.0';
        }

        inputTimeA.addEventListener('change', () => { 
            pointA = parseFloat(inputTimeA.value) || 0; 
            enforceABConstraint();
            updateABInputs();
            drawWaveform(); 
        });

        inputTimeB.addEventListener('change', () => { 
            pointB = parseFloat(inputTimeB.value) || 0; 
            enforceABConstraint();
            updateABInputs();
            drawWaveform(); 
        });

        aMinusBtn.addEventListener('click', () => { if (pointA !== null) { pointA = Math.max(0, pointA - 0.1); enforceABConstraint(); updateABInputs(); drawWaveform(); } });
        aPlusBtn.addEventListener('click', () => { if (pointA !== null) { pointA += 0.1; enforceABConstraint(); updateABInputs(); drawWaveform(); } });
        bMinusBtn.addEventListener('click', () => { if (pointB !== null) { pointB = Math.max(pointA + 0.1, pointB - 0.1); enforceABConstraint(); updateABInputs(); drawWaveform(); } });
        bPlusBtn.addEventListener('click', () => { if (pointB !== null) { pointB += 0.1; enforceABConstraint(); updateABInputs(); drawWaveform(); } });

        // --- 4. Global Shortcuts ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== noteTextarea && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                initAudioSmooth();
                togglePlay();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveNoteDirectly();
            }
        });

        // --- 5. Direct File Saving with Real-Time Local Timestamp ---
        openNativeFileBtn.addEventListener('click', async () => {
            if ('showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{ description: 'Markdown / Text', accept: { 'text/plain': ['.md', '.txt'] } }]
                    });
                    currentFileHandle = handle;
                    const file = await handle.getFile();
                    const text = await file.text();
                    noteTextarea.value = text;
                    saveLocalBackup();
                    wordCountText.textContent = `${text.length} 字`;
                    
                    const timeNow = new Date().toLocaleTimeString();
                    saveStateText.textContent = `已成功绑定原文件: ${handle.name} (${timeNow})`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    saveBtnText.textContent = '覆写保存 (⌘S)';
                } catch (err) {
                    console.log('用户取消选择或授权未通过');
                }
            } else {
                alert('请使用 Chrome 或 Edge 浏览器体验直接覆写本地文件功能。');
            }
        });

        async function saveNoteDirectly() {
            const content = noteTextarea.value;
            const timeNow = new Date().toLocaleTimeString();

            if (currentFileHandle) {
                try {
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    
                    saveStateText.textContent = `已于 ${timeNow} 成功保存至: ${currentFileHandle.name}`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    return;
                } catch (err) {
                    console.warn('保存遇到阻碍，重新申请文件窗口:', err);
                }
            }

            if ('showSaveFilePicker' in window) {
                try {
                    currentFileHandle = await window.showSaveFilePicker({
                        suggestedName: `Media_Note_${new Date().toISOString().slice(0, 10)}.md`,
                        types: [{ description: 'Markdown / Text', accept: { 'text/plain': ['.md', '.txt'] } }]
                    });
                    const writable = await currentFileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    
                    saveStateText.textContent = `已绑定并于 ${timeNow} 成功保存至: ${currentFileHandle.name}`;
                    saveStateText.className = 'text-emerald-400 font-semibold';
                    saveBtnText.textContent = '覆写保存 (⌘S)';
                } catch (err) {
                    // Cancelled
                }
            } else {
                exportDownloadFallback(content);
            }
        }

        saveNoteBtn.addEventListener('click', saveNoteDirectly);

        saveAsNoteBtn.addEventListener('click', async () => {
            currentFileHandle = null;
            await saveNoteDirectly();
        });

        function exportDownloadFallback(content) {
            const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Media_Note_${new Date().toISOString().slice(0, 10)}.md`;
            a.click();
            URL.revokeObjectURL(url);
            saveStateText.textContent = `已于 ${new Date().toLocaleTimeString()} 导出下载`;
        }

        function saveLocalBackup() {
            localStorage.setItem('studio_note_backup', noteTextarea.value);
        }

        noteTextarea.addEventListener('input', () => {
            saveLocalBackup();
            wordCountText.textContent = `${noteTextarea.value.length} 字`;
        });

        insertTimestampBtn.addEventListener('click', () => {
            const timeStr = `[${formatTime(mainMedia.currentTime)}] `;
            const start = noteTextarea.selectionStart;
            const end = noteTextarea.selectionEnd;
            const text = noteTextarea.value;
            noteTextarea.value = text.substring(0, start) + timeStr + text.substring(end);
            noteTextarea.selectionStart = noteTextarea.selectionEnd = start + timeStr.length;
            noteTextarea.focus();
            saveLocalBackup();
        });

        // Load Stored Backup
        const savedNote = localStorage.getItem('studio_note_backup');
        if (savedNote) {
            noteTextarea.value = savedNote;
            wordCountText.textContent = `${savedNote.length} 字`;
        }

        // --- 6. Resizable Panels Logic ---
        let isResizingWaveform = false;
        waveformResizer.addEventListener('mousedown', () => { isResizingWaveform = true; });

        let isResizingPanel = false;
        panelResizer.addEventListener('mousedown', () => { isResizingPanel = true; });

        window.addEventListener('mousemove', (e) => {
            if (isResizingWaveform) {
                const containerRect = leftPanel.getBoundingClientRect();
                const newHeight = containerRect.bottom - e.clientY;
                if (newHeight > 100 && newHeight < containerRect.height - 150) {
                    waveformBox.style.height = `${newHeight}px`;
                    drawWaveform();
                }
            }

            if (isResizingPanel) {
                const containerWidth = document.getElementById('mainContainer').clientWidth;
                const newWidth = containerWidth - e.clientX;
                if (newWidth > 280 && newWidth < containerWidth - 350) {
                    rightPanel.style.width = `${newWidth}px`;
                    drawWaveform();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isResizingWaveform = false;
            isResizingPanel = false;
        });

        // Helper: Format Seconds to MM:SS.s
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00.0';
            const m = Math.floor(seconds / 60);
            const s = (seconds % 60).toFixed(1);
            const mStr = m < 10 ? '0' + m : m;
            const sStr = s < 10 ? '0' + s : s;
            return `${mStr}:${sStr}`;
        }

        // Initial Canvas Draw
        window.addEventListener('resize', drawWaveform);
        drawWaveform();
    </script>
</body>
</html>
