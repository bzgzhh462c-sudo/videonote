<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video-Note Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom scrollbar for sleeker look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    
    .resizable-h { resize: horizontal; overflow: auto; }
    .resizable-v { resize: vertical; overflow: auto; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col font-sans overflow-hidden select-none">

  <!-- Header Navigation -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-1.5 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <i class="fa-solid me-1 fa-film text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-zinc-100 flex items-center gap-2">
          Video-Note Studio
          <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Pro</span>
        </h1>
      </div>
    </div>

    <!-- Global Controls & Shortcuts info -->
    <div class="flex items-center gap-3 text-xs text-zinc-400">
      <div class="hidden md:flex items-center gap-2 bg-zinc-800/80 px-2.5 py-1 rounded border border-zinc-700/50">
        <span class="bg-zinc-700 px-1.5 py-0.5 rounded text-[10px] text-zinc-200 font-mono">Space</span>
        <span>播放 / 暂停</span>
      </div>
      <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20">
        <i class="fa-solid fa-folder-open"></i>
        <span>打开本地视频</span>
        <input type="file" id="videoInput" accept="video/*" class="hidden">
      </label>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Left Panel: Video & Waveform Studio -->
    <section id="leftPanel" class="flex-1 flex flex-col min-w-[320px] bg-zinc-950 border-r border-zinc-800 overflow-hidden">
      
      <!-- Video Viewport -->
      <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden min-h-[200px]">
        <video id="mainVideo" class="w-full h-full object-contain max-h-full"></video>
      </div>

      <!-- Waveform & Segment Controls Box (Resizable Height) -->
      <div id="waveformBox" class="bg-zinc-900 border-t border-zinc-800 flex flex-col shrink-0 min-h-[140px] max-h-[500px] h-[220px] relative">
        
        <!-- Waveform Toolbar -->
        <div class="px-3 py-1.5 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-300 shrink-0">
          <div class="flex items-center gap-3">
            <span class="font-medium text-zinc-400 flex items-center gap-1">
              <i class="fa-solid fa-waveform text-indigo-400"></i> 波形与选区
            </span>
            <!-- AB Segment Indicators -->
            <div class="flex items-center gap-2 font-mono text-[11px] bg-zinc-950 px-2.5 py-1 rounded border border-zinc-800">
              <span class="text-emerald-400 flex items-center gap-1">A: <span id="pointAVal">00:00.0</span></span>
              <span class="text-zinc-600">|</span>
              <span class="text-rose-400 flex items-center gap-1">B: <span id="pointBVal">00:00.0</span></span>
            </div>
            <button id="toggleLoopBtn" class="px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition flex items-center gap-1 border border-zinc-700">
              <i class="fa-solid fa-rotate-right text-xs"></i>
              <span id="loopStatus">循环关闭</span>
            </button>
          </div>

          <!-- Zoom Controls -->
          <div class="flex items-center gap-1 bg-zinc-950 p-0.5 rounded border border-zinc-800">
            <button id="zoomOutBtn" class="px-2 py-0.5 hover:bg-zinc-800 rounded text-zinc-400 hover:text-zinc-100 transition" title="缩小波形"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <span id="zoomLevelText" class="px-1.5 text-[11px] font-mono text-indigo-400 min-w-[36px] text-center">1x</span>
            <button id="zoomInBtn" class="px-2 py-0.5 hover:bg-zinc-800 rounded text-zinc-400 hover:text-zinc-100 transition" title="放大波形"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
          </div>
        </div>

        <!-- Waveform Canvas Viewport -->
        <div id="canvasContainer" class="flex-1 relative overflow-x-auto overflow-y-hidden bg-zinc-950 cursor-crosshair">
          <canvas id="waveformCanvas" class="h-full block"></canvas>
        </div>

        <!-- A-B Micro-Adjustment Controls -->
        <div class="px-3 py-1.5 bg-zinc-900 border-t border-zinc-800 flex items-center justify-between text-xs shrink-0 flex-wrap gap-2">
          <div class="flex items-center gap-2">
            <span class="text-emerald-400 font-medium">A点:</span>
            <button id="setPointABtn" class="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded transition">设为当前</button>
            <button id="subA01" class="bg-zinc-800 hover:bg-zinc-700 px-1.5 py-0.5 rounded">-0.1s</button>
            <button id="addA01" class="bg-zinc-800 hover:bg-zinc-700 px-1.5 py-0.5 rounded">+0.1s</button>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-rose-400 font-medium">B点:</span>
            <button id="setPointBBtn" class="bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800 px-2 py-0.5 rounded transition">设为当前</button>
            <button id="subB01" class="bg-zinc-800 hover:bg-zinc-700 px-1.5 py-0.5 rounded">-0.1s</button>
            <button id="addB01" class="bg-zinc-800 hover:bg-zinc-700 px-1.5 py-0.5 rounded">+0.1s</button>
          </div>

          <button id="clearABBtn" class="text-zinc-500 hover:text-zinc-300 text-xs underline">重置选区</button>
        </div>

      </div>
    </section>

    <!-- Right Panel: Note Studio & Speech Transcript -->
    <section id="rightPanel" class="w-[420px] flex flex-col bg-zinc-900 border-l border-zinc-800 shrink-0">
      
      <!-- Note Header / Actions -->
      <div class="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between bg-zinc-900/90 shrink-0">
        <div class="flex items-center gap-2 text-sm font-semibold text-zinc-200">
          <i class="fa-regular fa-file-lines text-indigo-400"></i>
          <span>视频笔记</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- Stamp Insert -->
          <button id="insertStampBtn" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-indigo-300 border border-zinc-700 rounded text-xs transition flex items-center gap-1" title="插入当前视频时间戳">
            <i class="fa-solid fa-clock"></i>
            <span>时间戳</span>
          </button>

          <!-- Local File Operations -->
          <label class="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 rounded text-xs transition cursor-pointer" title="打开本地 Markdown 笔记文件">
            <i class="fa-solid fa-file-import"></i>
            <input type="file" id="noteFileInput" accept=".md,.txt" class="hidden">
          </label>
          <button id="exportNoteBtn" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-medium transition shadow-sm flex items-center gap-1" title="保存/导出笔记文件">
            <i class="fa-solid fa-download"></i>
            <span>保存笔记</span>
          </button>
        </div>
      </div>

      <!-- Note Editor Textarea -->
      <div class="flex-1 p-3 flex flex-col bg-zinc-950 overflow-hidden relative">
        <textarea id="noteTextarea" class="w-full h-full bg-transparent text-zinc-200 font-mono text-sm resize-none focus:outline-none p-2 leading-relaxed" placeholder="在此输入笔记内容...支持点击顶部「时间戳」按钮快速关联视频播放节点。支持打开和保存本地 .md/.txt 笔记。"></textarea>
      </div>

      <!-- Speech Recognition Drawer -->
      <div class="border-t border-zinc-800 bg-zinc-900 p-3 shrink-0 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-medium text-zinc-300">
            <i class="fa-solid fa-microphone text-rose-500"></i>
            <span>语音识别转写 (可选)</span>
          </div>
          <button id="toggleSpeechBtn" class="px-2.5 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 rounded text-xs transition flex items-center gap-1">
            <i class="fa-solid fa-power-off"></i>
            <span id="speechStatusText">启动识别</span>
          </button>
        </div>
        <div id="speechBox" class="h-20 bg-zinc-950 border border-zinc-800 rounded p-2 overflow-y-auto text-xs text-zinc-400 font-mono leading-normal">
          <span class="text-zinc-600 italic">点击启动识别，播放视频时语音转写内容将自动呈现在此...</span>
        </div>
      </div>

    </section>
  </main>

  <!-- Application Logic Script -->
  <script>
    // Global Application State
    const state = {
      videoFile: null,
      audioBuffer: null,
      duration: 0,
      zoomLevel: 1,
      pointA: 0,
      pointB: 0,
      isLooping: false,
      isDraggingA: false,
      isDraggingB: false,
      isDragSelecting: false,
      dragStartSec: 0,
      isSpeechActive: false,
      recognition: null,
      audioCtx: null
    };

    // DOM Elements
    const video = document.getElementById('mainVideo');
    const videoInput = document.getElementById('videoInput');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const canvasContainer = document.getElementById('canvasContainer');
    const noteTextarea = document.getElementById('noteTextarea');

    // Initialize UI Event Listeners
    window.addEventListener('DOMContentLoaded', () => {
      setupVideoEvents();
      setupWaveformEvents();
      setupNoteEvents();
      setupSpeechEvents();
      setupKeyboardShortcuts();
      loadSavedNote();
    });

    // 1. Video Loading & Web Audio Processing
    function setupVideoEvents() {
      videoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        state.videoFile = file;
        const url = URL.createObjectURL(file);
        video.src = url;
        video.load();

        // Extract Audio Stream & Decode Buffer for Crisp Waveform
        extractAudioBuffer(file);
      });

      video.addEventListener('loadedmetadata', () => {
        state.duration = video.duration || 1;
        state.pointA = 0;
        state.pointB = state.duration;
        updatePointDisplays();
        renderWaveform();
      });

      video.addEventListener('timeupdate', () => {
        // Handle AB Loop
        if (state.isLooping && state.pointB > state.pointA) {
          if (video.currentTime >= state.pointB || video.currentTime < state.pointA) {
            video.currentTime = state.pointA;
          }
        }
        renderWaveform();
        autoScrollWaveform();
      });
    }

    async function extractAudioBuffer(file) {
      try {
        if (!state.audioCtx) {
          state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const arrayBuffer = await file.arrayBuffer();
        state.audioBuffer = await state.audioCtx.decodeAudioData(arrayBuffer);
        renderWaveform();
      } catch (err) {
        console.warn('Audio decoding failed or muted file:', err);
      }
    }

    // 2. High Quality Crisp Waveform Rendering Engine
    function renderWaveform() {
      const dpr = window.devicePixelRatio || 1;
      const baseWidth = canvasContainer.clientWidth;
      const targetWidth = Math.max(baseWidth * state.zoomLevel, baseWidth);
      const targetHeight = canvasContainer.clientHeight;

      canvas.width = targetWidth * dpr;
      canvas.height = targetHeight * dpr;
      canvas.style.width = targetWidth + 'px';
      canvas.style.height = targetHeight + 'px';

      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, targetWidth, targetHeight);

      if (!state.duration) return;

      const midY = targetHeight / 2;

      // Draw Normalized Amplitude Waveform
      if (state.audioBuffer) {
        const rawData = state.audioBuffer.getChannelData(0);
        const samples = Math.floor(targetWidth * 1.5);
        const step = Math.ceil(rawData.length / samples);

        ctx.fillStyle = '#6366f1'; // Indigo waveform
        
        for (let i = 0; i < samples; i++) {
          let min = 1.0;
          let max = -1.0;
          for (let j = 0; j < step; j++) {
            const datum = rawData[i * step + j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }

          // Dynamic Boost & Normalization to fit height nicely
          const amp = Math.max(Math.abs(min), Math.abs(max)) * 2.2;
          const barHeight = Math.max(2, amp * midY * 0.85);

          const x = (i / samples) * targetWidth;
          ctx.fillRect(x, midY - barHeight / 2, 1.5, barHeight);
        }
      } else {
        // Fallback smooth visual curve when audio buffer decoding
        ctx.strokeStyle = '#4f46e5';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 0; x < targetWidth; x += 3) {
          const y = midY + Math.sin(x * 0.05) * (midY * 0.4);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Draw A-B Highlight Overlay Range
      const startX = (state.pointA / state.duration) * targetWidth;
      const endX = (state.pointB / state.duration) * targetWidth;
      ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
      ctx.fillRect(startX, 0, Math.max(0, endX - startX), targetHeight);

      // Draw Point A Indicator & Handle
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, 0); ctx.lineTo(startX, targetHeight);
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.fillRect(startX - 6, 0, 12, 14);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('A', startX - 3, 10);

      // Draw Point B Indicator & Handle
      ctx.strokeStyle = '#f43f5e';
      ctx.beginPath();
      ctx.moveTo(endX, 0); ctx.lineTo(endX, targetHeight);
      ctx.stroke();

      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(endX - 6, 0, 12, 14);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('B', endX - 3, 10);

      // Draw Playhead Line
      const playheadX = (video.currentTime / state.duration) * targetWidth;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(playheadX, 0); ctx.lineTo(playheadX, targetHeight);
      ctx.stroke();
    }

    // Auto-scroll Waveform Container to Follow Playhead
    function autoScrollWaveform() {
      if (state.zoomLevel <= 1 || !state.duration) return;
      const targetWidth = Math.max(canvasContainer.clientWidth * state.zoomLevel, canvasContainer.clientWidth);
      const playheadX = (video.currentTime / state.duration) * targetWidth;
      const halfViewport = canvasContainer.clientWidth / 2;

      if (playheadX > canvasContainer.scrollLeft + canvasContainer.clientWidth - 50 || playheadX < canvasContainer.scrollLeft) {
        canvasContainer.scrollLeft = playheadX - halfViewport;
      }
    }

    // 3. Mouse Interactions on Waveform (Drag A/B Handles & Click Jump)
    function setupWaveformEvents() {
      // Zoom In / Out Controls
      document.getElementById('zoomInBtn').onclick = () => {
        state.zoomLevel = Math.min(20, state.zoomLevel + 1.5);
        document.getElementById('zoomLevelText').innerText = state.zoomLevel.toFixed(1) + 'x';
        renderWaveform();
      };

      document.getElementById('zoomOutBtn').onclick = () => {
        state.zoomLevel = Math.max(1, state.zoomLevel - 1.5);
        document.getElementById('zoomLevelText').innerText = state.zoomLevel.toFixed(1) + 'x';
        renderWaveform();
      };

      // Handle Mouse Down on Canvas
      canvas.addEventListener('mousedown', (e) => {
        if (!state.duration) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const targetWidth = canvas.width / (window.devicePixelRatio || 1);
        const clickedSec = (clickX / targetWidth) * state.duration;

        const handleAX = (state.pointA / state.duration) * targetWidth;
        const handleBX = (state.pointB / state.duration) * targetWidth;

        // Check if handle A/B was clicked directly
        if (Math.abs(clickX - handleAX) < 10) {
          state.isDraggingA = true;
        } else if (Math.abs(clickX - handleBX) < 10) {
          state.isDraggingB = true;
        } else {
          // Jump playhead directly to click position
          video.currentTime = Math.max(0, Math.min(state.duration, clickedSec));
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.duration) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const targetWidth = canvas.width / (window.devicePixelRatio || 1);
        const currentSec = Math.max(0, Math.min(state.duration, (mouseX / targetWidth) * state.duration));

        if (state.isDraggingA) {
          state.pointA = Math.min(currentSec, state.pointB - 0.1);
          updatePointDisplays();
          renderWaveform();
        } else if (state.isDraggingB) {
          state.pointB = Math.max(currentSec, state.pointA + 0.1);
          updatePointDisplays();
          renderWaveform();
        }
      });

      window.addEventListener('mouseup', () => {
        state.isDraggingA = false;
        state.isDraggingB = false;
      });

      // A-B Control Buttons
      document.getElementById('setPointABtn').onclick = () => { state.pointA = video.currentTime; updatePointDisplays(); renderWaveform(); };
      document.getElementById('setPointBBtn').onclick = () => { state.pointB = video.currentTime; updatePointDisplays(); renderWaveform(); };
      document.getElementById('subA01').onclick = () => { state.pointA = Math.max(0, state.pointA - 0.1); updatePointDisplays(); renderWaveform(); };
      document.getElementById('addA01').onclick = () => { state.pointA = Math.min(state.pointB - 0.1, state.pointA + 0.1); updatePointDisplays(); renderWaveform(); };
      document.getElementById('subB01').onclick = () => { state.pointB = Math.max(state.pointA + 0.1, state.pointB - 0.1); updatePointDisplays(); renderWaveform(); };
      document.getElementById('addB01').onclick = () => { state.pointB = Math.min(state.duration, state.pointB + 0.1); updatePointDisplays(); renderWaveform(); };
      
      document.getElementById('clearABBtn').onclick = () => {
        state.pointA = 0;
        state.pointB = state.duration;
        updatePointDisplays();
        renderWaveform();
      };

      document.getElementById('toggleLoopBtn').onclick = () => {
        state.isLooping = !state.isLooping;
        const statusSpan = document.getElementById('loopStatus');
        statusSpan.innerText = state.isLooping ? '循环开启' : '循环关闭';
        statusSpan.parentElement.className = state.isLooping 
          ? 'px-2 py-1 rounded bg-indigo-950 text-indigo-300 border border-indigo-700 transition flex items-center gap-1 font-medium'
          : 'px-2 py-1 rounded bg-zinc-800 text-zinc-300 border border-zinc-700 transition flex items-center gap-1';
      };
    }

    function updatePointDisplays() {
      document.getElementById('pointAVal').innerText = formatTime(state.pointA);
      document.getElementById('pointBVal').innerText = formatTime(state.pointB);
    }

    // 4. Local Note System (File Open, Edit, Local Auto-save & Export)
    function setupNoteEvents() {
      // Auto save draft to LocalStorage
      noteTextarea.addEventListener('input', () => {
        localStorage.setItem('studio_note_draft', noteTextarea.value);
      });

      // Insert Current Video Timestamp
      document.getElementById('insertStampBtn').onclick = () => {
        const stamp = `[${formatTime(video.currentTime)}] `;
        const start = noteTextarea.selectionStart;
        const end = noteTextarea.selectionEnd;
        const val = noteTextarea.value;
        
        noteTextarea.value = val.substring(0, start) + stamp + val.substring(end);
        noteTextarea.selectionStart = noteTextarea.selectionEnd = start + stamp.length;
        noteTextarea.focus();
        localStorage.setItem('studio_note_draft', noteTextarea.value);
      };

      // Open Local Note File (.md / .txt)
      document.getElementById('noteFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          noteTextarea.value = evt.target.result;
          localStorage.setItem('studio_note_draft', noteTextarea.value);
        };
        reader.readAsText(file);
      });

      // Export / Download Local Note File
      document.getElementById('exportNoteBtn').onclick = () => {
        const text = noteTextarea.value;
        const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `video_note_${new Date().toISOString().slice(0,10)}.md`;
        a.click();
      };
    }

    function loadSavedNote() {
      const saved = localStorage.getItem('studio_note_draft');
      if (saved) noteTextarea.value = saved;
    }

    // 5. Web Speech API Integration
    function setupSpeechEvents() {
      const toggleBtn = document.getElementById('toggleSpeechBtn');
      const statusText = document.getElementById('speechStatusText');
      const speechBox = document.getElementById('speechBox');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusText.innerText = '浏览器不支持';
        toggleBtn.disabled = true;
        return;
      }

      state.recognition = new SpeechRecognition();
      state.recognition.continuous = true;
      state.recognition.interimResults = true;
      state.recognition.lang = 'zh-CN';

      state.recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        speechBox.innerHTML = `<div class="text-zinc-200"><span class="text-indigo-400 font-bold">[${formatTime(video.currentTime)}]</span> ${transcript}</div>`;
        speechBox.scrollTop = speechBox.scrollHeight;
      };

      toggleBtn.onclick = () => {
        state.isSpeechActive = !state.isSpeechActive;
        if (state.isSpeechActive) {
          state.recognition.start();
          statusText.innerText = '停止转写';
          toggleBtn.className = 'px-2.5 py-1 bg-rose-950 text-rose-300 border border-rose-700 rounded text-xs transition flex items-center gap-1 font-medium';
        } else {
          state.recognition.stop();
          statusText.innerText = '启动识别';
          toggleBtn.className = 'px-2.5 py-1 bg-zinc-800 text-zinc-300 border border-zinc-700 rounded text-xs transition flex items-center gap-1';
        }
      };
    }

    // 6. Global Keyboard Shortcuts (Space for Play/Pause)
    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        // Ignore spacebar shortcut when typing inside textarea
        if (e.code === 'Space' && document.activeElement !== noteTextarea) {
          e.preventDefault();
          if (video.paused) video.play(); else video.pause();
        }
      });
    }

    // Helper Utility Functions
    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00.0';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
    }
  </script>
</body>
